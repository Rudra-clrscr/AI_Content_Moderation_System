# Runtime settings for the moderation service.
# Any key can be overridden with an env var — see app/config.py.

mode: sync                 # sync  -> inference inline, final decision in the response
                           # async -> gate inline, model inference enqueued to Celery (202 pending)

model:
  backend: onnx            # onnx | stub   (stub = dev only, never deploy)
  dir: models/v6           # live model. To roll back, put an older bundle next to it and set
                           # dir: models/v4 (or MODEL_DIR=...).
                           # v1, v3 and v4 are no longer tracked in the repo;
                           # each bundle's model_meta.json carries its own label_weights.
  intra_op_threads: 4      # Keep workers x threads <= CPU cores. Measured on this 6-core host
                           # (p95 for one call): 2 threads 38 ms, 4 threads 30 ms, 6 threads 29 ms,
                           # 8 threads 30 ms, 12 threads 38 ms. 6 is best for a single request but
                           # leaves nothing for concurrent workers, so 4 stays the default.
  inter_op_threads: 1
  # label_weights:         # optional operator override of the bundle's weights (keys must match its labels).
                           # v4: labels [safe, unsafe], weights {safe: 0, unsafe: 1} -> risk = P(unsafe),
                           # temperature-calibrated in training, so 0.5 means "as likely harmful as not".
                           # v3 ships {safe: 0, review: 0.25, reject: 1} in models/v3/model_meta.json.

thresholds:                # v4: one boundary at 0.5 (calibrated P(unsafe))
  allow_max: 0.50          # risk <= 0.50 -> allow
  reject_min: 0.50         # risk >  0.50 -> reject: not published; the author sees the highlighted
                           #                 sentences and trigger words, rewrites and resubmits.
                           # (allow_max < reject_min restores a middle "revise" band; v3 used 0.30 / 0.70)

gate:
  patterns_file: config/gate_patterns.yaml

feedback:                  # what authors see when asked to revise or when rejected
  messages_file: config/feedback_messages.yaml

limits:
  max_chars: 25000          # articles: 20,000-char body + title + link URLs

media:                      # POST /v1/moderate/media: attachments on an article (app/media.py).
  enabled: true             # Anything published with a post must be checked, or the scam just
                            # moves into the picture. The kind is read from the file's bytes,
                            # never its name.
  max_bytes: 15000000       # one attachment (15 MB)
  max_pixels: 40000000      # decoded image size, against decompression bombs
  allow_unchecked_video: true
                            # INTERIM POLICY. Video cannot be read at all: no frame or audio
                            # analysis here. There is no visual model yet, so rather than block
                            # the Videos tab entirely, video publishes with the risk stated:
                            # the result carries checked: false and visual_content_checked:
                            # false, and the editor shows "not inspected" next to the file.
                            # Set back to false the day footage must not go out unwatched.
                            # NOTE: images are the same story. They are OCR'd for text, but the
                            # PICTURE is never classified - there is no nudity/violence/
                            # counterfeit detector in this service, so an image with no text is
                            # allowed and the result says visual_content_checked: false.
  visual:                   # LOOK AT THE PICTURE, not just the words in it (app/clip.py).
    enabled: true           # CLIP scores the image against the written descriptions in
                            # config/visual_policy.yaml, so the policy is that file and adding
                            # a category needs no retraining. VISUAL_CHECK=0 turns it off, and
                            # so does a missing model: results then say
                            # visual_content_checked: false exactly as they did before this
                            # existed. It is never a hard dependency for the Articles tab.
                            #
                            # Set up (once, offline - nothing is fetched while serving):
                            #   python scripts/fetch_clip.py
                            #   python scripts/build_clip_prompts.py
    model_dir: models/img_v1
                            # the image bundle, separate from the text model in models/v5:
                            # vision_model.onnx (352 MB) + prompts.npz. The TEXT encoder is not
                            # needed to serve: build_clip_prompts.py runs it offline and bakes
                            # the prompt embeddings into prompts.npz.
    reject_min: 0.90        # an unsafe label this confident refuses the upload. MEASURED on
                            # 1168 sample images with scripts/eval_clip_images.py:
                            #
                            #   reject_min  weapons  gore   false positives
                            #                              objects  BONC   bodies
                            #        0.50     93%    98%    5/200    0/63   17/105
                            #        0.80     83%    95%    2/200    0/63    7/105
                            #        0.90     77%    93%    0/200    0/63    3/105
                            #        0.95     72%    86%    0/200    0/63    1/105
                            #        0.97     67%    79%    0/200    0/63    0/105
                            #        0.99     57%    64%    0/200    0/63    0/105
                            #
                            # "bodies" is images/body_parts - athletes, physiotherapy, anatomy,
                            # swimming - collected to measure the `sexual` label, which has no
                            # positive samples behind it. It turned out to matter for `gore`
                            # too: before the safe list learned to describe a body in a
                            # legitimate context, 27% of that set scored unsafe at 0.90.
                            #
                            # 0.90 keeps every real BONC listing and every safe object, at
                            # 3 body pictures in 105. Nothing at all is refused until 0.97,
                            # which costs 10 points of weapon recall and 14 of gore. Re-run the
                            # script after ANY change to visual_policy.yaml - the numbers move
                            # with the prompts, which is how the body-part regression was
                            # found in the first place.
    max_pixels: 40000000    # decoded size, against decompression bombs (as media.max_pixels)
    probe_reject_min: 0.70  # the TRAINED probe's own boundary (models/img_v1/probe.npz,
                            # training/train_image_probe.py). A picture is refused if the
                            # written prompts cross reject_min OR the probe crosses this - they
                            # make different mistakes, and together they cover more than either.
                            #
                            # The probe is a logistic regression over the frozen encoder's
                            # embeddings, fitted on BONC's own 968 labelled pictures. Same shape
                            # as Layer 1.5's triage filter: scikit-learn to fit, one matrix
                            # multiply to serve, no new dependency in the Flask app.
                            #
                            # MEASURED out-of-fold with GROUPED cross-validation, so near-
                            # duplicate video frames never straddle a fold. That distinction is
                            # not pedantry: with a random split the weapons number reads 95%,
                            # and the honest one is 73%, because 300 frames from a handful of
                            # videos are easy to memorise and hard to generalise from.
                            #
                            #   prompts only @0.90   77% weapons  93% gore   0/63 BONC
                            #   + probe @0.90        85%          97%        0/63
                            #   + probe @0.70        93%          99%        0/63
                            #   + probe @0.50        96%         100%        0/63
                            #
                            # At the shipped 0.70, 12 of 458 safe pictures are refused: 3 of 200
                            # objects, 5 of 105 body parts, 4 of 90 ordinary crowds. REAL BONC
                            # LISTINGS ARE NEVER REFUSED at any threshold, which is what makes
                            # 0.70 affordable. Re-fit after adding images; delete probe.npz to
                            # fall back to prompts alone.
                            #
                            # The probe has FIVE classes: safe, weapon, gore, minor,
                            # revealing. This comment said "weapon and gore only" for weeks
                            # while the shipped probe.npz held four, because a `minor`
                            # experiment wrote the file and the trainer's CLASSES list was
                            # edited back a minute later without re-running it.
                            # training/train_image_probe.py now matches, and --classes makes a
                            # mismatch loud.
                            #
                            # 0.70 is the shipped bar but this probe's scores are SATURATED:
                            # 0.70, 0.80 and 0.85 give identical results on every set, so this
                            # number is not a useful tuning knob any more. Re-sweep it if the
                            # class list changes - the unsafe reading is 1 - P(safe), so it
                            # shifts with the number of classes. Every other label is
                            # carried by its prompts. `unrest` was tried as a fourth class and
                            # dropped: it cost 13 of 90 safe crowds and 10 of 105 body parts
                            # and gained nothing elsewhere. 90 examples cannot separate a
                            # protest crowd from a trade-fair crowd, where the difference is
                            # posture and expression rather than the scene.
                            #
                            # `minor` was tried four times and `physique` is not worth a fifth:
                            # both draw a line about FRAMING - is the child the subject, is the
                            # picture addressed to a buyer or about the poster's own body - and
                            # a linear model over one global embedding has no way to ask that.
                            # The text encoder can, so those labels live in the prompts.
                            #
                            # Note the probe is doing more than its three classes suggest: it
                            # is what takes minors from 64% to 96% and nudity from 68% to 95%
                            # at the shipped bars, by answering "not safe" on pictures well
                            # outside weapons and gore. Worth re-measuring deliberately rather
                            # than relying on; scripts/eval_clip_images.py --device cuda prints
                            # the shipped decision for every set.
    device: auto            # auto | cuda | directml | cpu. "auto" takes the best execution
                            # provider onnxruntime actually offers, so a host with the stock
                            # CPU-only wheel keeps working unchanged. For a GPU, install the
                            # matching build - they replace `onnxruntime`, never sit beside it:
                            #   NVIDIA:  pip install onnxruntime-gpu   (needs CUDA 12 + cuDNN 9)
                            #   any DX12 GPU on Windows: pip install onnxruntime-directml
                            # A named device that isn't installed falls back to CPU with a
                            # warning rather than refusing to start: no GPU must ever mean no
                            # Articles tab. GET /ready reports the provider actually in use.
                            # Measured on an RTX 4050 laptop: 14.8 images/s on 6 CPU cores,
                            # 60.5 on CUDA (4.1x faster, ~17 ms an image). The decisions are
                            # the same either way - 273 images scored on both gave the same
                            # label and the same verdict for all of them, with scores differing
                            # by at most 8.5e-03 - so the thresholds below do not change with
                            # the device.
    intra_op_threads: 4     # CPU only; ignored on a GPU provider
    inter_op_threads: 1
  allow_unreadable_image: false
                            # An image OCR found writing in but could NOT read (a script the
                            # recognition model doesn't cover, or a picture too poor to read).
                            # Nothing in such a picture has been checked, so it is refused -
                            # the same rule as pdf.reject_unreadable_pages, and for the same
                            # reason. Until the Devanagari recognition model is bundled (see
                            # ocr below), this refuses Hindi signage that used to publish with
                            # a clean result while the text read as gibberish. Set true to
                            # publish them anyway; they are then recorded with checked: false
                            # and the editor shows "not inspected", never a green OK.

  allow_unreadable_image_when_seen: true
                            # ...unless the VISUAL CHECK looked at the picture and cleared it.
                            # Refusing unreadable writing was right while nothing inspected the
                            # picture; app/clip.py now does, and the blanket refusal was turning
                            # away 19% of real BONC listings over logos, number plates and
                            # watermarks ("D", "CRUK", "00 0000"). What stays unknown is the
                            # WORDS, so the record still says checked: false - a narrower claim
                            # ("we looked at it, we could not read it"), never a clean result.
                            # Only ever reached when the visual check actually ran and found
                            # nothing; with it off or missing, the old refusal stands.
                            #
                            # The case this used to guard - a Devanagari threat published with
                            # a clean record - is now covered at the source instead: the
                            # Devanagari recognition model is bundled (pdf.ocr.rec_lang below),
                            # so Hindi is READ rather than falling down here. Verified end to
                            # end: a rendered Hindi threat is rejected by abuse.hi_targeted,
                            # benign Hindi signage publishes.
  ocr_text_reject_min: 0.99 # Words read off a photograph are held to a higher bar than words
                            # somebody typed, and to ONE boundary rather than two - a "revise"
                            # verdict says "edit the highlighted part", which cannot be done to
                            # text baked into a picture.
                            #
                            # Why: OCR of a shopfront returns word-salad ("TURNKEY MWRULTANTS A
                            # SOLUTIONS"), and the model was trained on prose, so it scored four
                            # ordinary BONC listings into the reject band. MEASURED with
                            # scripts/eval_ocr_text_bar.py, scoring rendered text read back
                            # through the real OCR stack:
                            #
                            #   scam flyers      10 images   0.9996 - 0.9997
                            #   threats           8 images   0.9990 - 0.9997 (one outlier, below)
                            #   business signage 10 images   0.0002 - 0.0009
                            #   real BONC listings  43       0.0002 - 0.9281
                            #
                            # Any bar in [0.95, 0.999] catches 17 of the 18 harmful images and
                            # refuses none of the 53 honest ones. 0.99 sits in the middle of
                            # that band. The 18th - "Stop trading or face consequences, we have
                            # your address" at 0.074 - is missed at EVERY bar including the
                            # ordinary 0.5, so it is a gap in the model, not in this number.
                            #
                            # Gate rules are unaffected: a rule either matched or it did not,
                            # and a scam phrase photographed is still a scam phrase. PDFs keep
                            # the ordinary bar - their text is extracted, not guessed at.

pdf:                        # POST /v1/moderate/pdf: extract the text, then moderate it normally
  enabled: true             # PDF_UPLOAD=0 turns the endpoint off
  max_bytes: 25000000       # 25 MB upload
  max_pages: 100
  max_chars: 100000         # extracted text. Longer documents are rejected, never truncated:
                            # truncating would leave the tail unchecked but still say "allowed".
                            # (limits.max_chars above still applies to what reaches the model.)
  min_chars_per_page: 20    # a page with images but less text than this counts as unreadable
  reject_unreadable_pages: true
                            # Scanned pages carry no extractable text, so nothing can be checked
                            # on them. Rejecting is the fail-closed choice: set false only if you
                            # accept publishing pages the moderator never read.

  ocr:                      # read the pixels of pages that carry no text (app/ocr.py, RapidOCR
    enabled: true           # on onnxruntime). PDF_OCR=0 turns it off and those pages go back to
                            # being refused. It widens what can be ACCEPTED; it is not a security
                            # control, because a page it fails to read is still refused.
    max_pages: 60           # per upload: ~0.5 s per page on CPU, bounds long catalogs
    dpi: 200                # enough for body text; pages stay around 2 megapixels
    max_pixels: 4000000     # hard cap per page whatever the dpi implies (hostile page sizes)
    min_chars: 20           # OCR must recover at least this much, or the page stays unreadable
    min_confidence: 0.5     # and be at least this confident, or we don't trust what it read
    min_chars_per_box: 5    # Detection finds where the writing is; recognition turns it into
    trust_short_confidence: 0.90
                            # characters. A script the recognition model doesn't cover still
                            # detects every line and then returns near-nothing, at a confidence
                            # that clears min_confidence - which is how a Devanagari threat in a
                            # PNG was reported as read and clean. Measured on rendered 48pt
                            # text, characters recovered per detected line: English 25-28 at
                            # conf 0.99, Hindi 1.5-4 at conf 0.62-0.76. So a line OCR really
                            # read comes back as a word or more; below min_chars_per_box the
                            # reading is not trusted unless recognition is at least
                            # trust_short_confidence sure (genuinely short signage: "SALE").
                            # Lowered 6 -> 5 (2026-10-08): a legitimate 12-line English
                            # shopfront sign averaged 5.8 and was refused on the technicality,
                            # while clean reads average 16 and the Devanagari failure this
                            # guards against sat at 1.5-4. 5 keeps the margin and stops
                            # refusing stylised signage.
                            # Devanagari recognition is ON (2026-10-08). RapidOCR ships Latin
                            # and Chinese only, which is why Hindi pictures used to read as
                            # gibberish and get refused. This model reads Latin too, so it
                            # REPLACES the default rather than running alongside it.
                            #   python scripts/fetch_ocr_langs.py devanagari
                            # The file is gitignored; re-run that on a fresh checkout, or
                            # comment the two keys below out to fall back to Latin-only.
                            # `--list` shows the other scripts available.
    rec_model_path: models/ocr/devanagari_rec.onnx
    rec_lang: devanagari

latency_budget_ms: 30      # inference-only budget for ONE call; overruns are logged, not failed.
                           # Realistic for short content (a listing is ~11 ms, p95 ~30 ms measured with
                           # scripts/bench_latency.py). An article that fills the 256-token window costs
                           # ~110 ms on this CPU and will log an overrun every time - that is the model's
                           # cost, not a fault. Use scripts/profile_latency.py for whole-request timings.

targeted_abuse:            # per-sentence model check for abuse aimed at a person/business
  enabled: true
  subjects: [he, she, his, her, him, they, them, their]
  max_segments: 3          # at most this many extra inferences per request

sentence_scan:             # score every sentence on its own: one reject-level sentence rejects the post
  enabled: true            # catches a scam tacked onto a clean listing (whole text can score ~0)
  max_sentences: 1700      # sentences + word windows scored on their own, batched 32 at a time.
                           # This must cover the LONGEST text that can reach the pipeline, which is
                           # a PDF's extracted text (pdf.max_chars, 100,000), not limits.max_chars:
                           # a span past the cap is scored by nothing, because the model's 256-token
                           # window cannot see that far either. 100,000 / ~62 chars per span = 1,613, so 1,700.
                           # tests/test_scan_coverage.py fails if pdf.max_chars outgrows this again.
  low_syntax_reject_min: 0.90
                           # A span with no grammatical substance (a row of logos, a catalogue
                           # heading) scores erratically, so it may only reject when the score
                           # leaves no doubt. Below this it is recorded and ignored. Dropping such
                           # spans from the scan entirely - as the first version of the syntax
                           # filter did - left them checked by nothing, and a counterfeit list at
                           # the end of a long article published clean.

triage:                    # Layer 1.5: a linear pre-filter in front of the sentence scan (app/triage.py).
  enabled: true            # Logistic regression over hashed n-grams, ~0.1 ms per span, distilled from the
  dir: models/triage-v1    # model's own decisions: it only clears spans the model would have allowed, so
                           # the scan's model calls drop sharply on clean posts. Retrain it with
                           # training/train_triage.py whenever the model changes; the bundle records the
                           # threshold, the skip rate and the misses it was measured at.
                           # threshold: 0.05   # uncomment to override the trained threshold (higher = skips more)
                           # TRIAGE=0 turns it off; decisions must not change, only latency.

grievance:                 # The public-surface complaint model (app/grievance.py).
  enabled: true            # Asks a DIFFERENT question from the model above: "would this be a
  dir: models/grievance-v7 #   customer-support complaint or an emotional outcry if it were PUBLISHED
                           #   NOT IN GIT (371 MB; see .gitignore for the four commands that rebuild
                           #   it). models/grievance-linear-v1 IS tracked - hashed n-grams, 928 KB,
                           #   78% caught against the transformer's 83% - so a fresh clone can point
                           #   here and have working cover instead of a disabled check.
                           #   to the network". The main model is surface-blind and must stay that
                           #   way, because the same sentence in a proposal is a member chasing a
                           #   consignment, which is the platform working.
  surfaces:                #   Hence: consulted here and nowhere else. A content_type not on this
    - article              #   list is never checked, including a new one - a classifier refusing a
    - post                 #   whole genre on a surface nobody reviewed is the regression this whole
    - advertisement        #   design exists to prevent. Add a surface deliberately, not by default.
  threshold: 0.95          # BUNDLE-SPECIFIC. 0.95 here is NOT a loosening of the 0.978 that
                           # grievance-v3 shipped: v7's temperature is 1.31345 against v3's
                           # 1.0, so the whole score distribution moved and 0.95 here does
                           # what 0.978 did there. Paste 0.978 against THIS bundle and
                           # workplace recall drops 76.9% -> 57.7% for nothing - a silent
                           # capability loss that reads like a model regression. Re-sweep per
                           # bundle; never carry a threshold across one.
                           #
                           # Measured on the bundle, on the three sets that were not generated
                           # (training/eval_grievance_model.py --sets, caught / wrongly refused):
                           #
                           #            workplace      handwritten-1   handwritten-2
                           #     0.70   92.3% / 20.0%   88.5% / 0%      100.0% / 0%
                           #     0.92   84.6% / 16.7%   84.6% / 0%      100.0% / 0%
                           #     0.94   76.9% / 13.3%   84.6% / 0%       94.4% / 0%
                           #     0.95   76.9% / 10.0%   84.6% / 0%       88.9% / 0%   <- shipped
                           #     0.98   57.7% / 10.0%   80.8% / 0%       77.8% / 0%
                           #
                           # 0.95 holds the precision posture 0.978 chose rather than the
                           # recall-first rule in train_grievance.pick_threshold, which would
                           # pick ~0.70 and refuse one legitimate employer post in five. That
                           # is a product call and the table is the whole of it; 0.92 and 0.94
                           # are both defensible and one line away.
                           #
                           # WHAT v7 ADDS. Workplace grievance - an employee against an
                           # EMPLOYER, where every bundle before it covered a buyer against a
                           # SELLER. Toxic workplace, overwork, management-bashing, pay and
                           # exit disputes, and the profane register (damn, shit, toxic
                           # dumpster). On v3 all five of the product owner's example
                           # sentences published; all five are now caught. The supplier
                           # capability improved at the same time, by 8 and 28 points, because
                           # the new genre taught the abstract shape rather than the
                           # vocabulary: a person aggrieved at an organisation, in public.
                           #
                           # Built incrementally (training/train_incremental.py): warm-started
                           # from the v6 checkpoint on 131k new rows plus a 15% rehearsal
                           # sample, 11 minutes rather than the 36-44 a full retrain costs,
                           # and the old-capability AUC gate passed at 1.0000 -> 1.0000.
                           #
                           # KNOWN MISS, CARRIED OVER FROM v3 AND STILL UNFIXED: "US and Iran
                           # war is going on since 10 months, and now both leaders are stuck,
                           # now it is stupidious to continue this war further" - a text the
                           # product owner ruled legitimate. The model reads commentary on
                           # world events as a grievance. No setting fixes it; training data
                           # separating "a war is going badly" from "my supplier is going
                           # badly" does.
                           #
                           # The 10% that remain are the model conflating "negative about a
                           # counterparty or an employer" with "complaint": third-person
                           # industry commentary, profane market idiom, and contentment
                           # phrased through negation. Still the figure this file called too
                           # high for production, and the honest ceiling of generated data.
                           #
                           # NOT TRACKED (371 MB). models/grievance-linear-v4 is, at 27% and
                           # 3.6%, so a fresh clone has cover.

word_scan:                 # word-by-word analysis (see app/targeted.py WordScan)
  enabled: true
  window_words: 40         # a sentence longer than this is also scored in overlapping word windows,
  window_stride: 20        #   so a harmful phrase in a long run-on sentence isn't diluted
  min_contribution: 0.10   # for each flagged sentence, each word is removed in turn and the sentence
  max_triggers: 5          #   re-scored; words that lower the risk by >= 0.10 are "trigger words",
  max_spans: 5             #   returned in word_scores and highlighted for the author
  max_words: 60
  deobfuscate: true        # also score a leetspeak-restored reading, word by word ("F1rst c0py" -> "First copy");
                           # the riskier of the two readings counts. Product codes (330W, A16, i5, 5kg) are untouched.
  max_candidates: 10       # This phase only draws highlights: it cannot change a decision, so it is
  max_calls: 40            # bounded hard. The linear pre-filter ranks the words (~0.1 ms each) and only
                           # max_candidates per span go to the model; max_calls caps the whole phase.
                           # Measured: a rejected 15-word sentence went 522 ms -> 199 ms, and a long
                           # run-on 1556 ms -> 243 ms. Lower them for speed, raise for finer highlights.

demo_page: false           # true (or DEMO_PAGE=1) serves the browser demo at /demo

result_sink: sql           # sql -> write to SQL Server (failures are logged, never fail the request)
                           # log -> JSON log lines only (dev / tests)

database:                  # server, name, user, password come from env / .env — see app/config.py
  driver: ODBC Driver 18 for SQL Server
  trust_server_certificate: true
  timeout_seconds: 5

celery:
  broker_url: redis://localhost:6379/0
  result_backend: redis://localhost:6379/1
  queue: moderation
