# Runtime settings for the moderation service.
# Any key can be overridden with an env var — see app/config.py.

mode: sync                 # sync  -> inference inline, final decision in the response
                           # async -> gate inline, model inference enqueued to Celery (202 pending)

model:
  backend: onnx            # onnx | stub   (stub = dev only, never deploy)
  dir: models/v4           # live model. To roll back, put a v3 bundle next to it and set
                           # dir: models/v3 (or MODEL_DIR=...) AND the v3 thresholds below.
                           # v1 and v3 are no longer tracked in the repo (see flask_api/README.md);
                           # each bundle's model_meta.json carries its own label_weights.
  intra_op_threads: 4      # Keep workers x threads <= CPU cores. Measured on this 6-core host
                           # (p95 for one call): 2 threads 38 ms, 4 threads 30 ms, 6 threads 29 ms,
                           # 8 threads 30 ms, 12 threads 38 ms. 6 is best for a single request but
                           # leaves nothing for concurrent workers, so 4 stays the default.
  inter_op_threads: 1
  # label_weights:         # optional operator override of the bundle's weights (keys must match its labels).
                           # v4: labels [safe, unsafe], weights {safe: 0, unsafe: 1} -> risk = P(unsafe),
                           # temperature-calibrated in training, so 0.5 means "as likely harmful as not".
                           # v3 ships {safe: 0, review: 0.25, reject: 1} in models/v3/model_meta.json.

thresholds:                # v4: one boundary at 0.5 (calibrated P(unsafe))
  allow_max: 0.50          # risk <= 0.50 -> allow
  reject_min: 0.50         # risk >  0.50 -> reject: not published; the author sees the highlighted
                           #                 sentences and trigger words, rewrites and resubmits.
                           # (allow_max < reject_min restores a middle "revise" band; v3 used 0.30 / 0.70)

gate:
  patterns_file: config/gate_patterns.yaml

feedback:                  # what authors see when asked to revise or when rejected
  messages_file: config/feedback_messages.yaml

limits:
  max_chars: 25000          # articles: 20,000-char body + title + link URLs

media:                      # POST /v1/moderate/media: attachments on an article (app/media.py).
  enabled: true             # Anything published with a post must be checked, or the scam just
                            # moves into the picture. The kind is read from the file's bytes,
                            # never its name.
  max_bytes: 15000000       # one attachment (15 MB)
  max_pixels: 40000000      # decoded image size, against decompression bombs
  allow_unchecked_video: true
                            # INTERIM POLICY. Video cannot be read at all: no frame or audio
                            # analysis here. There is no visual model yet, so rather than block
                            # the Videos tab entirely, video publishes with the risk stated:
                            # the result carries checked: false and visual_content_checked:
                            # false, and the editor shows "not inspected" next to the file.
                            # Set back to false the day footage must not go out unwatched.
                            # NOTE: images are the same story. They are OCR'd for text, but the
                            # PICTURE is never classified - there is no nudity/violence/
                            # counterfeit detector in this service, so an image with no text is
                            # allowed and the result says visual_content_checked: false.
  allow_unreadable_image: false
                            # An image OCR found writing in but could NOT read (a script the
                            # recognition model doesn't cover, or a picture too poor to read).
                            # Nothing in such a picture has been checked, so it is refused -
                            # the same rule as pdf.reject_unreadable_pages, and for the same
                            # reason. Until the Devanagari recognition model is bundled (see
                            # ocr below), this refuses Hindi signage that used to publish with
                            # a clean result while the text read as gibberish. Set true to
                            # publish them anyway; they are then recorded with checked: false
                            # and the editor shows "not inspected", never a green OK.

pdf:                        # POST /v1/moderate/pdf: extract the text, then moderate it normally
  enabled: true             # PDF_UPLOAD=0 turns the endpoint off
  max_bytes: 10000000       # 10 MB upload
  max_pages: 100
  max_chars: 100000         # extracted text. Longer documents are rejected, never truncated:
                            # truncating would leave the tail unchecked but still say "allowed".
                            # (limits.max_chars above still applies to what reaches the model.)
  min_chars_per_page: 20    # a page with images but less text than this counts as unreadable
  reject_unreadable_pages: true
                            # Scanned pages carry no extractable text, so nothing can be checked
                            # on them. Rejecting is the fail-closed choice: set false only if you
                            # accept publishing pages the moderator never read.

  ocr:                      # read the pixels of pages that carry no text (app/ocr.py, RapidOCR
    enabled: true           # on onnxruntime). PDF_OCR=0 turns it off and those pages go back to
                            # being refused. It widens what can be ACCEPTED; it is not a security
                            # control, because a page it fails to read is still refused.
    max_pages: 10           # per upload: ~0.5 s per page on CPU, so this bounds the request
    dpi: 200                # enough for body text; pages stay around 2 megapixels
    max_pixels: 4000000     # hard cap per page whatever the dpi implies (hostile page sizes)
    min_chars: 20           # OCR must recover at least this much, or the page stays unreadable
    min_confidence: 0.5     # and be at least this confident, or we don't trust what it read
    min_chars_per_box: 6    # Detection finds where the writing is; recognition turns it into
    trust_short_confidence: 0.90
                            # characters. A script the recognition model doesn't cover still
                            # detects every line and then returns near-nothing, at a confidence
                            # that clears min_confidence - which is how a Devanagari threat in a
                            # PNG was reported as read and clean. Measured on rendered 48pt
                            # text, characters recovered per detected line: English 25-28 at
                            # conf 0.99, Hindi 1.5-4 at conf 0.62-0.76. So a line OCR really
                            # read comes back as a word or more; below min_chars_per_box the
                            # reading is not trusted unless recognition is at least
                            # trust_short_confidence sure (genuinely short signage: "SALE").
                            # The Devanagari recognition model is NOT bundled - RapidOCR ships
                            # Latin and Chinese only, which is why Hindi pictures are refused
                            # rather than read. Fetch it (~8 MB, once, not at request time) and
                            # uncomment the two keys below:
                            #   python scripts/fetch_ocr_langs.py devanagari
                            # It reads Latin script too, so it replaces the default rather than
                            # running alongside it. `--list` shows the other scripts available.
    # rec_model_path: models/ocr/devanagari_rec.onnx
    # rec_lang: devanagari

latency_budget_ms: 30      # inference-only budget for ONE call; overruns are logged, not failed.
                           # Realistic for short content (a listing is ~11 ms, p95 ~30 ms measured with
                           # scripts/bench_latency.py). An article that fills the 256-token window costs
                           # ~110 ms on this CPU and will log an overrun every time - that is the model's
                           # cost, not a fault. Use scripts/profile_latency.py for whole-request timings.

targeted_abuse:            # per-sentence model check for abuse aimed at a person/business
  enabled: true
  subjects: [he, she, his, her, him, they, them, their]
  max_segments: 3          # at most this many extra inferences per request

sentence_scan:             # score every sentence on its own: one reject-level sentence rejects the post
  enabled: true            # catches a scam tacked onto a clean listing (whole text can score ~0)
  max_sentences: 400       # sentences + word windows scored on their own. v4 is batch-invariant, so they
                           # are scored in batches of 32 (one ONNX call each) instead of one by one.
                           # 400 covers a full 25,000-character article.

triage:                    # Layer 1.5: a linear pre-filter in front of the sentence scan (app/triage.py).
  enabled: true            # Logistic regression over hashed n-grams, ~0.1 ms per span, distilled from the
  dir: models/triage-v1    # model's own decisions: it only clears spans the model would have allowed, so
                           # the scan's model calls drop sharply on clean posts. Retrain it with
                           # training/train_triage.py whenever the model changes; the bundle records the
                           # threshold, the skip rate and the misses it was measured at.
                           # threshold: 0.05   # uncomment to override the trained threshold (higher = skips more)
                           # TRIAGE=0 turns it off; decisions must not change, only latency.

word_scan:                 # word-by-word analysis (see app/targeted.py WordScan)
  enabled: true
  window_words: 40         # a sentence longer than this is also scored in overlapping word windows,
  window_stride: 20        #   so a harmful phrase in a long run-on sentence isn't diluted
  min_contribution: 0.10   # for each flagged sentence, each word is removed in turn and the sentence
  max_triggers: 5          #   re-scored; words that lower the risk by >= 0.10 are "trigger words",
  max_spans: 5             #   returned in word_scores and highlighted for the author
  max_words: 60
  deobfuscate: true        # also score a leetspeak-restored reading, word by word ("F1rst c0py" -> "First copy");
                           # the riskier of the two readings counts. Product codes (330W, A16, i5, 5kg) are untouched.
  max_candidates: 10       # This phase only draws highlights: it cannot change a decision, so it is
  max_calls: 40            # bounded hard. The linear pre-filter ranks the words (~0.1 ms each) and only
                           # max_candidates per span go to the model; max_calls caps the whole phase.
                           # Measured: a rejected 15-word sentence went 522 ms -> 199 ms, and a long
                           # run-on 1556 ms -> 243 ms. Lower them for speed, raise for finer highlights.

demo_page: false           # true (or DEMO_PAGE=1) serves the browser demo at /demo

result_sink: sql           # sql -> write to SQL Server (failures are logged, never fail the request)
                           # log -> JSON log lines only (dev / tests)

database:                  # server, name, user, password come from env / .env — see app/config.py
  driver: ODBC Driver 18 for SQL Server
  trust_server_certificate: true
  timeout_seconds: 5

celery:
  broker_url: redis://localhost:6379/0
  result_backend: redis://localhost:6379/1
  queue: moderation
