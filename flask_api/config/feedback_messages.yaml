# What authors see when their post isn't published straight away.
# Edit the wording here; no code change is needed.

# {noun} is replaced by the content type's name below, e.g. "Your article needs a few changes".
nouns:
  article: article
  product_listing: listing
  business_profile: business profile
  advertisement: ad
  post: post
  video: video
  request: request
  proposal: proposal
  business_proposal: business proposal

revise:
  title: Your {noun} needs a few changes
  message: >-
    Some parts of your {noun} may go against BONC's community policies.
    Edit the highlighted parts and publish again.

reject:
  title: Your {noun} can't be published
  # {categories} is replaced with the policy areas, e.g. "fraud and scams".
  message: >-
    It appears to break BONC's community policies on {categories}.
    Rewrite the highlighted parts and submit your {noun} again.
    If you think this is a mistake, contact support.
  message_generic: >-
    It appears to break BONC's community policies.
    Rewrite the highlighted parts and submit your {noun} again.
    If you think this is a mistake, contact support.

# With v4 there is no middle "revise" band: anything over the 0.5 risk boundary is
# rejected and the author rewrites it, so rejections highlight the sentences and the
# trigger words that caused them. (Trade-off: a determined scammer also sees what
# tripped the filter. Set to false to show only the policy area.)
highlight_on_reject: true

# At most this many sentences are scored individually to find what to highlight
# when the model asks for a revision (each is one extra model inference).
max_highlight_sentences: 5

# Human-readable names for rule categories, used in reject messages.
categories:
  abuse: abusive language
  profanity: profanity
  fraud: fraud and scams
  spam: spam

# Instruction shown next to each highlighted match, by rule id.
rules:
  payment.off_platform: >-
    Payments must go through BONC. Remove requests to pay by crypto, gift cards
    or money-transfer services.
  profanity.wordlist: Remove the profanity. Keep posts professional.
  abuse.targeted: Remove insults aimed at a person or business.
  abuse.blocklist: Remove abusive language.
  scam.advance_fee: Remove guaranteed-return or advance-fee claims.
  spam.blacklisted_domain: Remove the link to a blocked website.
  spam.url_shortener: Use the full web address instead of a shortened link.
  contact.messenger_redirect: Buyers can contact you through BONC; you don't need to share a phone number.
  evasion.off_platform_b2b: >-
    Transactions must be conducted on BONC. Remove requests to bypass the portal,
    avoid platform escrow, or settle off the books.
  fraud.counterfeit_certification: >-
    Offering counterfeit goods, replica products, or fake/tampered certifications
    is strictly prohibited.
  threat.property_sabotage: >-
    Threats of arson, sabotage, property damage, or violence are strictly prohibited.
  defamation.corporate_smear: >-
    Defamatory statements, unverified insolvency claims, and smear campaigns against
    businesses are prohibited.

# Instructions for text highlighted by the model.
model:
  sentence: >-
    This sentence may go against our community policies. Rewrite it so it's
    factual, specific and respectful (the words in bold are the main problem).
  targeted: >-
    This sentence about another person or business may come across as hostile.
    Rephrase it respectfully, or remove it.
