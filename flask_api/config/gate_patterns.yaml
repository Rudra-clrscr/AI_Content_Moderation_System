# Layer 1 deterministic gate.
#
# Text is normalised before matching (Unicode NFKC, casefolded, zero-width
# characters stripped, whitespace collapsed), so write patterns in lowercase.
#
# action:
#   block  -> reject immediately, model is skipped
#   revise -> fixable: the author is shown the highlighted text and asked to edit it;
#             the model still runs and can still reject
#   flag   -> recorded in the result for the audit log only; doesn't change the decision
#
# Author-facing wording for each rule lives in config/feedback_messages.yaml.
#
# rules[].patterns   : Python regexes
# rules[].terms      : literal words/phrases; escaped and word-bounded automatically
# rules[].terms_file : path to a newline-separated term list (for lists that
#                      shouldn't live in git, e.g. the slur list from policy)

version: 2                   # 2: 'revise' action; no human review

rules:
  - id: abuse.blocklist
    category: abuse
    action: block
    description: Abusive language. The inline terms are demo entries; the full
      slur list from the policy team is added from terms_file when present.
    terms:
      - moron
      - scumbag
      - go to hell
    terms_file: config/private/slurs.txt      # optional, gitignored; skipped if missing

  - id: abuse.targeted
    category: abuse
    action: block
    kind: targeted
    description: Insults or profanity aimed at a person or business - a word that
      points at someone (he, she, his, her, they, them...) and a listed term in the
      same sentence, in either order. Policy (senior review, 2026-09) - nobody may
      point abuse at an individual. "They are idiots", "What an idiot he is" and
      "Idiots like them" are blocked; "the idiot-proof design" is not.
      you/your are deliberately NOT subjects - they blocked fraud-awareness articles
      ("Scammers create urgency, so take your time"); the model covers "you idiot".
    subjects: [he, she, his, her, hers, him, himself, herself, they, them, their, theirs, themselves]
    terms:                                    # curated personal insults (committed)
      - idiot
      - moron
      - imbecile
      - stupid
      - fool
      - loser
      - scum
      - scumbag
      - jerk
      - clown
      - pathetic
      - worthless
      - lowlife
      - degenerate
      - nitwit
      - halfwit
      - dimwit
      - cretin
      - hypocrite
      - coward
      - psycho
      - dumbass
      - bastard
      - sucks
      - go to hell
      # character attacks: words that are almost always aimed at a person, not a product.
      # Deliberately NOT here (innocent B2B uses): disturbing ("found the results disturbing"),
      # toxic ("toxic chemicals"), cheat ("cheat sheet"), evil ("evil-eye bracelets"), thief,
      # corrupt ("a corrupt file").
      - shameless
      - shameful
      - disgraceful
      - despicable
      - vile
      - crook
      - cheats
      - cheater
      - cheating
      - liar
      - fraudster
      - scammer
      - con artist
      - conman
      - sick-minded
      - sick minded
    terms_file:                               # downloaded by scripts/fetch_wordlists.py (gitignored)
      - config/private/wordlists/ldnoobw_en.txt
      - config/private/wordlists/google_profanity_en.txt
    exclude_file: config/wordlist_exclusions.txt
    exclude:                                  # not insults when aimed at a business
      - viagra
      - cialis
      - cyalis
      - v1gra
      - v14gra
      - sexual
      - sexually
      - sexuality
      - intercourse
      - lovemaking
      - nudity
      - topless

  - id: profanity.wordlist
    category: profanity
    action: revise
    kind: words
    description: Profanity not aimed at anyone - the author is asked to remove it.
    terms_file:
      - config/private/wordlists/ldnoobw_en.txt
      - config/private/wordlists/google_profanity_en.txt
    exclude_file: config/wordlist_exclusions.txt
    exclude:                                  # innocent when not aimed at someone
      - suck
      - sucks
      - retard
      - retards
      - spastic
      - tranny
      - swastika
      - sexual
      - sexuality

  # ---------------------------------------------------------------------------------------
  # Hindi and Hinglish. Members write Devanagari, Roman-script Hindi and a mix of both in the
  # same sentence; the model is English-centric and scored Hindi abuse at 0.02-0.05, so none
  # of it was caught (QA, 2026-09-30). Roman transliteration has no standard spelling, so the
  # common variants are listed out. Text is NFKC-normalised and casefolded before matching,
  # and a word character includes Devanagari vowel marks (app/targeted.py WORD_CHAR).
  # ---------------------------------------------------------------------------------------

  - id: abuse.hi_blocklist
    category: abuse
    action: block
    kind: words
    description: Hindi/Hinglish profanity and slurs with no innocent reading, in Devanagari
      and Roman script. Words that also have an ordinary meaning (chor, gadha, bewakoof)
      are deliberately NOT here - they are in abuse.hi_targeted, which only fires when the
      abuse is pointed at someone, the same split the English rules use.
    terms:
      - मादरचोद
      - बहनचोद
      - भोसड़ी
      - भोसड़ीके
      - चूतिया
      - चुतिया
      - चूतिये
      - गांडू
      - लंडू
      - रंडी
      - हरामी
      - हरामखोर
      - हरामजादा
      - हरामजादे
      - कमीना
      - कमीने
      - कमीनी
      - भड़वा
      - चुदाई
      - madarchod
      - madarchood
      - behenchod
      - bhenchod
      - bhosadi
      - bhosdike
      - bhosadike
      - chutiya
      - chutiye
      - chutiyapa
      - gandu
      - gaandu
      - lodu
      - randi
      - harami
      - haramkhor
      - haramzada
      - haramzade
      - haramjada
      - kamina
      - kamine
      - kamini
      - bhadwa
      - chudai

  - id: abuse.hi_targeted
    category: abuse
    action: block
    kind: targeted
    description: >-
      Hindi/Hinglish insults aimed at a person or business - a word that points at someone
      and a listed term in the same sentence. Same policy as abuse.targeted (nobody may
      point abuse at an individual), and the subject requirement is there for the same
      reason: "chor bazaar ka saaman" and "gadha 40 kg" are ordinary listings, while "tum
      chor ho" and "ye manager bewakoof hai" are not. Unlike the English rule the informal
      second person (tum/tu/tera) IS a subject, because it reads as confrontational in B2B
      Hindi, where ordinary copy addresses the reader as aap.
    subjects: [तुम, तुम्हें, तुमको, तुम्हारा, तुम्हारी, तुम्हारे, तू, तुझे, तुझको, तेरा, तेरी, तेरे,
               ये, यह, वो, वह, सब, सबको, इनका, उनका, साला, साले,
               tum, tumhe, tumhein, tumko, tumhara, tumhari, tumhare, tu, tujhe, tujhko,
               tera, teri, tere, ye, yeh, wo, woh, sab, sabko, inka, unka, saala, saale]
    terms:
      - बेवकूफ
      - बेवकूफों
      - मूर्ख
      - गधा
      - गधे
      - चोर
      - झूठा
      - झूठे
      - धोखेबाज
      - नालायक
      - निकम्मा
      - बदमाश
      - लुटेरा
      - ठग
      - घटिया
      - bewakoof
      - bewaqoof
      - bevakoof
      - bewkoof
      - murkh
      - gadha
      - gadhe
      - chor
      - jhootha
      - jhoota
      - dhokhebaaz
      - dhokebaaz
      - nalayak
      - nikamma
      - badmash
      - badmaash
      - lutera
      - thag

  - id: threat.violence_hi
    category: abuse
    action: block
    description: Threats of violence or arson in Hindi/Hinglish ("jaan se maar dunga",
      "dukaan jala denge"). Written as phrases, not single words, because "maar" and "jala"
      are ordinary verbs on their own ("machine band kar ke jala diya" is a fault report).
    patterns:
      - 'जान से मार'
      - 'मार\s*(?:दूंगा|दूँगा|दूगा|दूंगी|देंगे|डालूंगा|डालूँगा|डालेंगे)'
      - 'जला\s*(?:दूंगा|दूँगा|दूगा|दूंगी|देंगे|डालूंगा|डालूँगा|डालेंगे)'
      - 'खत्म\s+कर\s*(?:दूंगा|दूँगा|देंगे)'
      - '(?:जिंदा|ज़िंदा|जिन्दा)\s+नहीं\s+छोड़ूंगा'
      - '(?:टांगें|टाँगें|हाथ\s+पैर)\s+तोड़'
      - 'गोली\s+मार'
      - '\bjaan\s+se\s+maar'
      - '\bmaar\s+(?:dunga|doonga|dungi|denge|dalunga|daalunga|dalenge)\b'
      - '\bjala\s+(?:dunga|doonga|dungi|denge|dalunga|daalunga|dalenge)\b'
      - '\bkhatam\s+kar\s+(?:dunga|doonga|denge)\b'
      - '\bzinda\s+nahi[n]?\s+(?:chodunga|chhodunga)\b'
      - '\bgoli\s+maar'

  - id: spam.url_shortener
    category: spam
    action: flag
    description: Shortened links hide the destination. Recorded only; common in legitimate ads.
    patterns:
      - '\b(?:bit\.ly|tinyurl\.com|t\.co|goo\.gl|ow\.ly|is\.gd|cutt\.ly|rb\.gy)/\S+'

  - id: spam.blacklisted_domain
    category: spam
    action: block
    description: Domains known to host scams or malware.
    terms:                                      # demo entries on reserved TLDs (.example/.test)
      - fast-cash-bonanza.example
      - claim-free-gift.test
      - paypa1-verify.example

  - id: scam.advance_fee
    category: fraud
    action: block
    description: Classic advance-fee / guaranteed-return wording.
    patterns:
      - '\bguaranteed\s+(?:returns?|profits?)\s+of\s+\d+\s*%'
      - '\b(?:double|triple)\s+your\s+(?:money|investment)\b'
      - '\bpay\s+(?:a\s+)?(?:small\s+)?(?:processing|release|clearance)\s+fee\b'

  - id: payment.off_platform
    category: fraud
    action: revise
    description: Requests to pay via untraceable channels - the author is asked to remove them.
    patterns:
      - '\b(?:pay|payment|send)\b.{0,40}\b(?:gift\s*cards?|crypto|bitcoin|usdt|western\s+union|moneygram)\b'

  - id: contact.messenger_redirect
    category: spam
    action: flag
    description: WhatsApp/Telegram contact numbers. Recorded only; common in legitimate Indian B2B listings.
    patterns:
      - '\b(?:whatsapp|telegram|signal)\b.{0,20}\+?\d[\d\s-]{7,}'

  - id: evasion.off_platform_b2b
    category: fraud
    action: block
    description: B2B off-platform payment evasion, escrow bypass, and side-deal solicitations.
    patterns:
      - '\b(?:off\s+the\s+books|bypass\s+(?:escrow|platform|portal)|outside\s+the\s+portal)\b'
      # "we/I settle in raw cash", not "we cannot settle in raw cash".
      - '\b(?:we|i)\s+(?:will\s+|shall\s+|only\s+)*settle\s+(?:all\s+transactions\s+)?in\s+raw\s+cash\b'
      - '\b(?:skip\s+platform\s+checkout|do\s+not\s+(?:place\s+order|order)\s+on\s+(?:bonc|portal|platform)|do\s+not\s+generate\s+platform\s+purchase\s+order)\b'
      - '\b(?:wire\s+funds\s+directly\s+to\s+director\s+account|side-deal\s+rate|route\s+this\s+shipment\s+outside\s+the\s+portal)\b'
      - '\b(?:orders?\s+(?:on|through)\s+portal\s+will\s+be\s+cancelled|all\s+orders\s+on\s+portal\s+will\s+be\s+cancelled)\b'
      - '\b(?:platform\s+pe\s+order\s+mat\s+karo|platform\s+ko\s+beech\s+mein\s+mat\s+laao)\b'
      - '\btransfer\s+advance\s+token\s+to\s+(?:our\s+)?personal\s+paytm\b'
      - '\bsave\s+commission\b.{0,30}\b(?:whatsapp|upi|direct)\b'

  - id: fraud.counterfeit_certification
    category: fraud
    action: block
    description: >-
      Counterfeit goods, duplicate industrial OEM parts, and forged certifications.
      "fabricated" and "unauthorized" were removed from the adjective list in front of a
      standard: they are ordinary trade words ("fabricated ISI marked angles" is metalwork,
      "report sellers using unauthorized trademarks" is compliance writing), and they blocked
      six honest sentences. "fabricated" is kept in front of DOCUMENTS, where it does mean
      forged. KNOWN TRADE-OFF: a fraud-awareness article naming "counterfeit BIS hallmark
      stickers" is still blocked. That is deliberate - measured on v5, the model alone catches
      only 2 of 5 counterfeit OFFERS ("we can supply counterfeit BIS hallmark stickers" scores
      0.0016), so this rule is load-bearing and cannot be handed to the model the way
      abuse.targeted handed it "you idiot".
    patterns:
      - '\b(?:counterfeit|cloned|stamped\s+with\s+counterfeit)\s+(?:isi|bis|hallmark|\d+\s+bis\s+hallmark|iso|blister\s+strips?|oem\s+blue\s+boxes|brand\s+blister|security\s+holographic\s+seals|castrol|mobil|rolex|omega|nike|adidas|louis\s+vuitton|gucci|skf|timken)\b'
      # Forged paperwork: here "fabricated" and "fake" really do mean forged.
      - '\b(?:counterfeit|fabricated|forged|fake)\s+(?:test\s+reports?|mill\s+test\s+certificates?|certificates?|invoices?)\b'
      - '\b(?:commercial\s+replica|high-grade\s+replica)\s+(?:skf|timken|bearings|louis|gucci)\b'
      - '\b(?:replica|cloned)\s+(?:skf|timken)\s+bearings\b'
      - '\b(?:counterfeit|replica)\s+branded\s+presentation\s+box\b'
      - '\bphotoshop\s+modified\s+certificates\b'

  - id: threat.property_sabotage
    category: abuse
    action: block
    description: Threats of arson, sabotage, chemical damage, or industrial destruction.
    patterns:
      - '\byour\s+(?:shop|godown|factory|warehouse|office|unit|plant|business|stock)\b[^.!?]{0,40}\b(?:catch(?:es|ing)?\s+fire|will\s+burn|turned?\s+into\s+ash(?:es)?)\b'
      - '\b(?:i|we)\s+(?:will|shall|am\s+going\s+to|are\s+going\s+to)\s+(?:burn|torch|set\s+fire\s+to)\b'
      - '\bburn\s+(?:down\s+)?your\b'
      - '\bpour\s+(?:hydrochloric\s+)?acid\s+(?:on|over)\s+(?:you|your|him|her|them)\b'
      - '\b(?:i|we)\s+(?:will|shall)\s+(?:destroy\s+the\s+entire\s+plant|smash\s+your\s+vehicles)\b'
      - '\b(?:bury\s+your\s+business|fumes\s+when\s+the\s+valves\s+open)\b'

  # A buyer's product or service grievance, on the PUBLIC surfaces only.
  #
  # The same sentence is two different things depending on where it is posted. "The item
  # arrived completely damaged" sent to a supplier inside a proposal or a request is ordinary
  # trade, and carrying that conversation is what the platform is for. Published as an article
  # to the whole network it is a complaint about a company, which belongs on that company's
  # own channel.
  #
  # This is a gate rule with `surfaces` rather than training data, and that is the whole
  # point. The model sees text and has no idea which surface it came from, so teaching it to
  # refuse these sentences would refuse them in the proposal too - and 50,000 rows of exactly
  # this genre sit in training as ALLOWED on purpose, because an earlier round over-refused
  # them and made the portal useless for disputes.
  #
  # Deliberately narrow: a defect, a wrong item, a missing delivery, a refused claim. Firm
  # commercial language is not here and stays publishable everywhere.
  - id: complaint.public_grievance
    category: complaint
    action: block
    surfaces: [article, post, advertisement]
    description: A buyer's product or service complaint, published to the network.
    patterns:
      - '\b(?:item|parcel|package|product|order|consignment)\s+(?:arrived|came|was\s+delivered)\s+(?:completely\s+)?(?:damaged|broken|faulty|defective|smashed|cracked)\b'
      - '\bnothing\s+like\s+(?:the\s+)?(?:picture|photo|image|description|sample)\b'
      - '\bstopped\s+working\s+(?:on\s+the\s+)?(?:very\s+)?first\s+(?:use|day|wash|try)\b'
      - '\b(?:ripped|tore|torn|faded|shrank)\s+(?:during|in|on)\s+the\s+first\s+wash\b'
      - '\bi\s+(?:ordered|bought|purchased)\b[^.!?]{0,80}\bbut\s+i\s+(?:received|got|was\s+sent)\b'
      - '\bsays?\s+(?:my\s+)?(?:package|parcel|order|shipment)\s+was\s+delivered\b[^.!?]{0,60}\b(?:not\s+here|never\s+(?:arrived|received)|cannot\s+find)\b'
      - '\b(?:claim|refund|replacement|warranty)\s+(?:was\s+)?(?:denied|rejected|refused)\b'
      - '\bhidden\s+(?:deep\s+)?(?:with)?in\s+the\s+fine\s+print\b'
      - '\b(?:worst|terrible|pathetic|useless)\s+(?:service|product|quality|experience)\b[^.!?]{0,40}\b(?:ever|avoid|never\s+again)\b'
      # Bare disparagement of a named third party, which is what prompted this rule: "that
      # company's delivery system is very bad" carries no defect, no wrong item and no refused
      # claim, so none of the patterns above see it. It needs the adjective to be negative -
      # "their pricing is very competitive" is the same shape and must stay publishable.
      - '\b(?:that|this|their)\s+(?:company(?:''s)?|firm(?:''s)?|supplier(?:''s)?|vendor(?:''s)?)?\s*(?:\w+\s+){0,2}(?:system|service|delivery|quality|support|product|staff)\s+(?:is|are|was|were)\s+(?:very\s+|really\s+|extremely\s+|so\s+)?(?:bad|poor|terrible|awful|pathetic|useless|horrible|rubbish|worst)\b'
      # How the courier behaved, which is its own complaint and shares no vocabulary with the
      # ones above: the goods are fine, the handling was not. Every pattern needs a PAST tense
      # act on a specific consignment, because the present tense is how a logistics company
      # describes its own policy - "our drivers never leave a parcel in the rain" is the same
      # words and must stay publishable.
      - '\b(?:left|dumped|abandoned|threw|tossed|chucked)\b[^.!?]{0,50}\b(?:package|parcel|order|consignment|shipment|box|delivery|item|product)\b[^.!?]{0,50}\b(?:out\s+)?in\s+the\s+(?:pouring\s+|heavy\s+|open\s+)?rain\b'
      - '\b(?:package|parcel|order|consignment|shipment|box|item|product)\b[^.!?]{0,40}\bwas\s+(?:left|dumped|abandoned)\b[^.!?]{0,40}\b(?:in\s+the\s+(?:pouring\s+|heavy\s+)?rain|unattended|on\s+the\s+(?:street|road|pavement|footpath))\b'
      - '\b(?:threw|tossed|chucked|flung)\b[^.!?]{0,40}\b(?:package|parcel|order|box|shipment|item|product|consignment)\b[^.!?]{0,30}\b(?:over|across)\s+the\s+(?:gate|wall|fence|hedge|railing)\b'
      - '\b(?:left|dumped|abandoned)\b[^.!?]{0,50}\b(?:package|parcel|order|consignment|shipment|item|product)\b[^.!?]{0,60}\b(?:unattended|on\s+the\s+(?:street|road|pavement|footpath)|outside\s+the\s+(?:gate|door|house|building|shop))\b'
      - '\b(?:driver|courier|delivery\s+(?:guy|boy|man|person|agent|executive|partner)|delivery\s+staff)\b[^.!?]{0,40}\b(?:was|were)\s+(?:very\s+|extremely\s+|really\s+|so\s+)?(?:rude|abusive|careless|reckless|negligent|unprofessional)\b'

  - id: defamation.corporate_smear
    category: abuse
    action: block
    description: Fabricated insolvency, extortion hoaxes, and malicious smear campaigns.
    patterns:
      - '\b(?:fake|false|fabricated|bogus)\s+insolvency\b'
      - '\brecover\s+your\s+money\s+before\s+they\s+shut\s+down\b'
      - '\b(?:toxic\s+recycled\s+hospital\s+waste|post\s+defamatory\s+videos|delivered\s+to\s+enforcement\s+directorate)\b'
      - '\bdefective\s+brake\s+cables\s+that\s+will\s+snap\b'
