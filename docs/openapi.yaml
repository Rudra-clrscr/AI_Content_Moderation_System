openapi: 3.0.4

info:
  title: BONC Moderation API
  version: "1.9"
  description: |
    Text and image moderation for the BONC platform.

    **Result schema version is `1.9`** — that is what `info.version` tracks, since the
    result payload is the contract consumers depend on. The HTTP surface is versioned
    separately by the `/v1/` path prefix.

    ### Reading a response

    Every response is the company `ApiResponse<T>` envelope — `Success`, `Message`, `Data`,
    and nothing else. **The payload is in `Data`.** It is not repeated at the top level:
    the company's own envelopes declare `additionalProperties: false`, so an extra key
    would make the response invalid against the contract this service exists to satisfy.

    A refusal is **not** an HTTP error. `Data.Action: "reject"` comes back `200` with
    `Success: true` — the request succeeded, the content was refused. Branch on
    `Data.Action`, and reserve error handling for 4xx and 5xx, where `Success` is `false`
    and `Data.code` names the failure.

    `Data.Action` is binary (`approved` / `reject`) because the .NET publishing workflow
    is. `Data.decision` is not: a revise band keeps the word `revise` there, so the
    author-facing surfaces can tell "edit the highlighted part and resubmit" from "this
    will not be published". A caller reading `decision` must treat `revise` as a refusal.

    ### Authentication

    - The `/v1/moderate*` endpoints are called by the BONC .NET server. When `SERVICE_TOKEN`
      is set it sends `Authorization: Bearer <SERVICE_TOKEN>`; when it is unset they are
      **open** (`GET /ready` reports `service_auth: "open"` or `"enforced"`). That token is
      server-to-server only, so this page does not offer it under Authorize. The two probes
      are always open, so a load balancer can reach them without a secret.
    - **There is no admin login on this service.** Admins sign in on the BONC .NET side
      and bring that sign-in's token as `Authorization: Bearer` (`BoncAdmin`). Each request
      is checked against the .NET endpoint named by `BONC_AUTH_VERIFY_URL`; `GET /ready`
      reports `admin_verifier: bonc` once it is set.
    - **Authorize → BoncAdmin** is the one sign-in on this page: paste the admin's BONC
      `AuthToken` (without the word `Bearer`).
    - Scripts and ops can still send the `X-Admin-Token` header when `ADMIN_TOKEN` is set;
      it is not offered here. A request that carries a bearer token is judged on that token
      alone.
    - `POST /v1/admin/model/reload` accepts the **`X-Admin-Token` only**, entered as a field
      on that endpoint.
    - With neither `BONC_AUTH_VERIFY_URL` nor `ADMIN_TOKEN` set, admin endpoints answer
      `404` ("disabled"), not `401`. With `AUTH_DISABLED=1` they are open.
    - An accepted BONC token is trusted for `BONC_AUTH_CACHE_SECONDS` (default 60) before
      .NET is asked again; refusals are never cached.
    - Browser calls from another origin need that origin in `ADMIN_CORS_ORIGINS`; only
      `/v1/admin/*` sends CORS headers, and never `Allow-Credentials`.

    ### Testing notes

    Call `GET /ready` first. If the model did not load, `/v1/moderate` answers `503` and
    `/ready` explains why in `model_error` — the process stays up with a broken model by
    design.

  contact:
    name: API reference
    url: https://github.com/Rudra-clrscr/BONC/blob/main/docs/API_REFERENCE.md

servers:
  # RELATIVE ON PURPOSE, AND FIRST. Swagger UI sends "Try it out" to the selected server, so
  # an absolute URL here is the origin the browser calls - and this service sends no CORS
  # headers, by design, because adding them would relax the browser's protection on the
  # unauthenticated submission endpoints for the sake of a developer convenience.
  #
  # So an absolute `http://localhost:8000` breaks "Try it out" for anyone who opened the page
  # at 127.0.0.1, or on a LAN address, or through a tunnel: same service, different origin
  # string, request blocked, and the UI reports it as the unhelpful "Failed to fetch".
  # A relative URL resolves against whatever origin the page itself came from, which is the
  # one origin that is always right.
  - url: /
    description: This instance - whatever host and port you opened this page on.
  - url: http://localhost:8000
    description: Local development, for reading this document outside the service.
  - url: https://moderation.internal.boncnetwork.com
    description: |
      The AI/ML host. This service runs on its own machine, beside the models rather than
      beside the caller, and the main .NET server reaches it over the network — so the
      bearer token and the network boundary in front of it are both load-bearing. Replace
      this URL with the real host.

# Order matters: Swagger UI lists sections in this order, and the moderation and admin
# endpoints are the ones that get deployed and tested. The dev pages come last.
tags:
  - name: Moderation
    description: The product. Submit content, get a decision.
  - name: "Admin: auth"
    description: Who a request is signed in as. Sign-in itself happens on BONC (.NET).
  - name: "Admin: health"
    description: Whether each model and database actually works right now, and recent traffic.
  - name: "Admin: levels"
    description: How strictly each surface is moderated.
  - name: "Admin: audit"
    description: The moderation log and its exports.
  - name: "Admin: blocking"
    description: Refusing submissions from one member, one address, or a whole network.
  - name: "Admin: images"
    description: The image dataset behind the visual check, and its training.
  - name: "Admin: policy"
    description: The visual policy, written in words.
  - name: Operational
    description: Liveness and readiness, plus the docs and the dev-only demo pages.

security: []

# =====================================================================================
paths:

  # ---- Moderation -------------------------------------------------------------------
  /v1/moderate:
    post:
      tags: [Moderation]
      summary: Moderate text
      operationId: moderateText
      # Gated by the bearer token when SERVICE_TOKEN is set, and open when it is not.
      # Declared optional ([] alongside Bearer) because both are real deployments: the
      # token is how this is meant to run, and open is what a local checkout does.
      parameters:
        - $ref: '#/components/parameters/MemberIdHeader'
      description: |
        The endpoint the platform calls on every piece of member-written text.

        **Join the whole form into one `content` string** — harm split across fields is
        still harm, and moderating fields separately misses a clean title with the scam in
        the body.

        What that means per surface, in the order the composer shows them:

        | Surface | Send | Leave out |
        |---|---|---|
        | `article`, `network_article` | Title, Body, Hashtags, any link URLs | Article Type and Visibility — dropdowns, not member-written |
        | `post`, `group_post` | The post text, Hashtags | — |
        | `job` | Title, CompanyName, Description, Responsibilities, Requirements, Qualification, KeySkills, Benefits | EmploymentType, WorkMode, JobCategory, City/State/Country, Status — all pickers or structured values |
        | `product_listing`, `business_profile`, … | Every free-text box on that form | Pickers, toggles, IDs |

        Separate the fields with a **blank line**, and expand each hashtag into its words —
        `#dripIrrigation` goes as `drip Irrigation`, because the model scores words and a
        run-together tag scores nothing. `buildArticleContent` in
        `app/static/articles/moderation-client.js` is the reference implementation of both.

        **Uploads are not part of this.** Pictures and PDFs attached to the same form go to
        `POST /v1/moderate/media`, one request each, so every attachment gets its own
        decision and its own audit row. Both in one go: `POST /v1/moderate/unified`.

        ### Which fields may be empty

        **`content` may never be empty.** Blank or whitespace-only is `400 invalid_content`,
        and a `400` is not an approval — hold the item, do not publish it.

        | Composer field | Empty allowed? | What to send |
        |---|---|---|
        | Article **Title** | No — the composer marks it required | Join it. If it somehow arrives blank, join what is left rather than sending nothing. |
        | Article **Body** | No — likewise | As above. |
        | **Hashtags** | Yes | Omit the field from the join. Do not send an empty line for it. |
        | **Post text** | Yes, when the post is media-only | Then do **not** call this endpoint — there is no text. Call `/v1/moderate/media`, or `/v1/moderate/unified`, which takes either or both. |
        | Article Type, Visibility, Status | n/a | Never sent. They are pickers with fixed values, not member-written text. |
        | Thumbnail, Medias, PdfBase64 | Yes | Not text. Each attachment goes to `/v1/moderate/media` on its own. |

        > **The upstream DTOs do not enforce any of this.** In `bonc_swagger.json` every one
        > of these is `nullable` with no `required` list and no `minLength` — including
        > `Title` and `Body`, which the composer marks required with an asterisk. The UI
        > enforces it; the contract does not. So treat every field as possibly absent, build
        > the join from what is actually there, and decide what to do when nothing is: a
        > submission with no text and no attachment has nothing to moderate and nothing to
        > publish.

        `content_type` does not change how the text is scored. It selects the admin's
        level for that surface, the author-facing wording, and whether surface-scoped
        gate rules and the grievance check apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type]
              description: >-
                Send the parts (`title`, `body`, `hashtags`) and let the service join them,
                or send one pre-joined `content`. Not both - that is a `400`.
              properties:
                title:
                  type: string
                  description: >-
                    The article's title. `Title` is accepted too, since that is what
                    `CreateArticleDto` calls it.
                body:
                  type: string
                  description: The article's body, or a post's text. `Body` also accepted.
                hashtags:
                  description: >-
                    A list of tags, or the single comma-separated string the company's DTOs
                    carry. Each is expanded into its words before scoring - `#dripIrrigation`
                    is checked as `drip Irrigation`, because a run-together tag is one
                    unknown token and scores nothing. `Hashtags` also accepted.
                  oneOf:
                    - { type: array, items: { type: string } }
                    - { type: string }
                  example: ["#dripIrrigation", "#sustainableFarming"]
                content:
                  type: string
                  minLength: 1
                  maxLength: 25000
                  description: >-
                    The whole submission as one string, for a caller that would rather join it
                    itself - the parts above are the easier road. Non-empty after stripping;
                    the limit is `limits.max_chars`, and an article with a 20,000-character
                    body fits. Offsets in `feedback.issues` index into this exact string, so
                    join it the same way every time if you want to highlight the field a
                    problem came from.
                content_type:
                  $ref: '#/components/schemas/ContentType'
                content_id:
                  oneOf:
                    - { type: string }
                    - { type: integer }
                  description: Your platform's own ID. Always returned as a string.
                user_id:
                  type: string
                  description: Optional. The member who submitted, as your platform identifies them. Recorded in the moderation log so admins can see repeat offenders; never affects the decision, but a member an admin has blocked is refused with `403 member_blocked`. Also accepted as userId / UserId or an X-User-Id header.
            examples:
              article:
                summary: An article - title, body and hashtags
                value:
                  Title: Why our mill switched to drip irrigation
                  Body: We cut water use by 40% over two seasons across 120 acres, and the yield held.
                  Hashtags: "#dripIrrigation,#sustainableFarming"
                  content_type: article
                  content_id: ART-8831
              post:
                summary: A post - its text and hashtags
                value:
                  TextContent: Shipping two containers of long-grain rice to Dubai this week.
                  Hashtags: "#export,#logistics"
                  content_type: post
                  content_id: POST-9912
              jobPosting:
                summary: A job posting - every prose box of CreateJobDTO
                value:
                  Title: Warehouse Supervisor
                  CompanyName: Fortune Agro Exports
                  Description: Oversee inbound and outbound shipments at our Pune facility.
                  Responsibilities: Plan shifts, maintain stock accuracy, report weekly.
                  Requirements: Three years in logistics.
                  Qualification: Graduate in any discipline.
                  KeySkills: inventory, SAP, team handling
                  Benefits: PF, health cover, annual bonus
                  content_type: job
                  content_id: JOB-4412
      responses:
        "200":
          description: A decision was reached — allow, revise **or** reject.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResultApiResponse' }
        "202":
          description: Async mode only — queued for scoring.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingResultApiResponse' }
        "401": { $ref: '#/components/responses/ServiceTokenRequired' }
        "400":
          description: '`invalid_json`, `invalid_content`, `invalid_content_type`, `invalid_content_id`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "403":
          description: '`client_blocked` — this address is on the blocklist. `member_blocked` — the member named by `user_id` / `X-User-Id` is blocked; show them that their account cannot post.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                member_blocked:
                  summary: This member is blocked
                  value:
                    Success: false
                    Message: This account is not allowed to submit content right now.
                    Data: { code: member_blocked, message: This account is not allowed to submit content right now. }
                client_blocked:
                  summary: This address or network is blocked
                  value:
                    Success: false
                    Message: submissions from this connection are not being accepted.
                    Data: { code: client_blocked, message: submissions from this connection are not being accepted. }
        "413":
          description: '`content_too_long`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "500":
          description: '`inference_failed` — carries `request_id`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "503":
          description: '`model_not_ready`, or `queue_unavailable` in async mode.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/moderate/media:
    post:
      tags: [Moderation]
      summary: Moderate an uploaded image
      operationId: moderateMedia
      # Gated by the bearer token when SERVICE_TOKEN is set, and open when it is not.
      # Declared optional ([] alongside Bearer) because both are real deployments: the
      # token is how this is meant to run, and open is what a local checkout does.
      parameters:
        - $ref: '#/components/parameters/MemberIdHeader'
      description: |
        Post **one** file per request — each gets its own decision and its own audit row.
        The kind is detected from the file's bytes, never its name.

        - **Image** — two passes. OCR reads any writing; the CLIP visual check scores the
          picture itself. Text read off a picture is judged at a raised bar (0.99) with no
          revise band.
        - **PDF** — **not examined.** Extraction was removed while the scanned-page path is
          reworked, so a PDF now follows the video rule: `media.allow_unchecked_pdf`
          (default **true**) decides whether it is refused or published with
          `checked: false`. There is no `pdf` block in the result any more, and
          `POST /v1/moderate/pdf` is gone — post to this path instead.
        - **Video** — not examined. `media.allow_unchecked_video` decides whether it is
          refused or published with `checked: false`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            examples:
              article:
                summary: An image attached to an article
                value: { content_type: article, content_id: ART-8831 }
              post:
                summary: An image attached to a post
                value: { content_type: post, content_id: POST-9912 }
              jobPosting:
                summary: An image attached to a job posting
                value: { content_type: job, content_id: JOB-4412 }
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image, PDF or video. One 15 MB cap for every kind.
                content_type:
                  allOf: [{ $ref: '#/components/schemas/ContentType' }]
                  default: article
                content_id:
                  type: string
                user_id:
                  type: string
                  description: Optional. The member who submitted, as your platform identifies them. Recorded in the moderation log so admins can see repeat offenders; never affects the decision, but a member an admin has blocked is refused with `403 member_blocked`. Also accepted as userId / UserId or an X-User-Id header.
            encoding:
              file: { contentType: "image/png, image/jpeg, application/pdf, video/mp4" }
      responses:
        "200":
          description: |
            A decision was reached. The body is the ordinary result plus a `media` block.
            A PDF or a video carries `checked: false` in it and nothing else was read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaModerationResultApiResponse' }
        "401": { $ref: '#/components/responses/ServiceTokenRequired' }
        "400":
          description: '`invalid_file`, `invalid_content_type`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "403":
          description: '`client_blocked` (address) or `member_blocked` (the member sending it)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                member_blocked:
                  summary: This member is blocked
                  value:
                    Success: false
                    Message: This account is not allowed to submit content right now.
                    Data: { code: member_blocked, message: This account is not allowed to submit content right now. }
                client_blocked:
                  summary: This address or network is blocked
                  value:
                    Success: false
                    Message: submissions from this connection are not being accepted.
                    Data: { code: client_blocked, message: submissions from this connection are not being accepted. }
        "413":
          description: '`media_too_large`, `content_too_long`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "422":
          description: |
            `media_unreadable` (writing OCR could not read), `media_unsupported`
            (not an image, PDF or video), or `media_not_checkable` — a video with
            `allow_unchecked_video` false, or a PDF with `allow_unchecked_pdf` false.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "503":
          description: '`media_not_checkable` — the OCR or visual model threw. Retryable.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/moderate/unified:
    post:
      tags: [Moderation]
      summary: Unified moderation endpoint (text, image, or both)
      operationId: moderateUnified
      parameters:
        - $ref: '#/components/parameters/MemberIdHeader'
      description: |
        Intelligently moderates text, image/media, or both in a single unified wrapper API.

        - **Text only** (Case 1): Calls ONLY the DeBERTa model pipeline; skips image model.
        - **Image only** (Case 2): Calls ONLY the image moderation model; skips DeBERTa.
        - **Both text and image** (Case 3): Calls both text and image moderation models.
          If either check rejects, the final combined decision is reject.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: |
                    Text content to moderate (optional if file provided). Use this **or**
                    `Title` / `Body` / `Hashtags`, not both — sending both is a 400. A box left
                    blank counts as not sent, so a picture with every text box empty is checked
                    as a picture only.
                Title:
                  type: string
                  description: The article or post title. The service joins `Title`, `Body` and `Hashtags` into the text it scores.
                Body:
                  type: string
                  description: The article body, or a post's text. Use this, not `content`, when you send a `Title`.
                Hashtags:
                  type: string
                  description: 'Comma-separated, e.g. `#dripIrrigation,#sustainableFarming`. Each tag is split into its words before scoring.'
                file:
                  type: string
                  format: binary
                  description: Image, PDF or video attachment (optional if text provided).
                content_type:
                  allOf: [{ $ref: '#/components/schemas/ContentType' }]
                  default: article
                content_id:
                  type: string
                user_id:
                  type: string
                  description: Optional. The member who submitted, as your platform identifies them. Recorded in the moderation log so admins can see repeat offenders; never affects the decision, but a member an admin has blocked is refused with `403 member_blocked`. Also accepted as userId / UserId or an X-User-Id header.
          application/json:
            examples:
              article:
                summary: An article - title, body and hashtags
                value:
                  Title: Why our mill switched to drip irrigation
                  Body: We cut water use by 40% over two seasons across 120 acres, and the yield held.
                  Hashtags: "#dripIrrigation,#sustainableFarming"
                  content_type: article
                  content_id: ART-8831
              post:
                summary: A post - its text and hashtags
                value:
                  TextContent: Shipping two containers of long-grain rice to Dubai this week.
                  Hashtags: "#export,#logistics"
                  content_type: post
                  content_id: POST-9912
              jobPosting:
                summary: A job posting - every prose box of CreateJobDTO
                value:
                  Title: Warehouse Supervisor
                  CompanyName: Fortune Agro Exports
                  Description: Oversee inbound and outbound shipments at our Pune facility.
                  Responsibilities: Plan shifts, maintain stock accuracy, report weekly.
                  Requirements: Three years in logistics.
                  Qualification: Graduate in any discipline.
                  KeySkills: inventory, SAP, team handling
                  Benefits: PF, health cover, annual bonus
                  content_type: job
                  content_id: JOB-4412
            schema:
              type: object
              properties:
                content:
                  type: string
                  description: Text content to moderate. Use this **or** the DTO parts (`Title`, `Body`, `Hashtags`, ...), not both.
                Title:
                  type: string
                Body:
                  type: string
                Hashtags:
                  type: string
                content_type:
                  allOf: [{ $ref: '#/components/schemas/ContentType' }]
                  default: article
                content_id:
                  type: string
      responses:
        "200":
          description: Moderation completed. Envelope Data includes overall decision and individual checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnifiedModerationResultApiResponse' }
        "401": { $ref: '#/components/responses/ServiceTokenRequired' }
        "400":
          description: '`invalid_request` (neither text nor media provided, or `content` sent together with `Title`/`Body`/`Hashtags`), `invalid_content` (empty string), `invalid_content_type`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "403":
          description: '`client_blocked` (address) or `member_blocked` (the member sending it)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                member_blocked:
                  summary: This member is blocked
                  value:
                    Success: false
                    Message: This account is not allowed to submit content right now.
                    Data: { code: member_blocked, message: This account is not allowed to submit content right now. }
                client_blocked:
                  summary: This address or network is blocked
                  value:
                    Success: false
                    Message: submissions from this connection are not being accepted.
                    Data: { code: client_blocked, message: submissions from this connection are not being accepted. }
        "413":
          description: '`content_too_long`, `media_too_large`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "422":
          description: '`media_unsupported`, `media_unreadable`, `media_not_checkable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "503":
          description: '`model_not_ready`, `media_not_checkable`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/moderate/{request_id}:
    get:
      tags: [Moderation]
      summary: Fetch an async result
      operationId: moderationStatus
      # Gated by the bearer token when SERVICE_TOKEN is set, and open when it is not.
      # Declared optional ([] alongside Bearer) because both are real deployments: the
      # token is how this is meant to run, and open is what a local checkout does.
      description: |
        Only meaningful in async mode. **In sync mode this returns `404 not_supported`**,
        because there is nothing to poll.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 'The completed result, or `{"status": "pending" | "failed"}`.'
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ModerationResultApiResponse' }
                  - { $ref: '#/components/schemas/PendingResultApiResponse' }
        "401": { $ref: '#/components/responses/ServiceTokenRequired' }
        "404":
          description: '`not_supported` — status lookup is async-mode only.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---- Operational ------------------------------------------------------------------
  /health:
    get:
      tags: [Operational]
      summary: Liveness
      operationId: health
      description: Always `200`. Touches nothing, so it stays up while the model is broken.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthApiResponse' }

  /ready:
    get:
      tags: [Operational]
      summary: Readiness, and the most useful diagnostic in the service
      operationId: ready
      description: |
        Returns `503` with `status: "not_ready"` when the mode is `sync` and the model is
        not loaded. The body is identical either way, so a failing probe still explains
        itself through `model_error`.

        Two fields exist so an operator can see things from outside rather than infer them
        from published content: `visual` (are pictures actually being looked at) and
        `moderation_disabled_for` (which surfaces are unmoderated right now).
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatusApiResponse' }
        "503":
          description: 'The model is not loaded. Same body, `status: "not_ready"`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyStatusApiResponse' }

  /demo:
    get:
      tags: [Operational]
      summary: Browser demo UI (dev only)
      operationId: demoPage
      description: Enabled with `DEMO_PAGE=1`; never on in production. `404` otherwise.
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "404": { $ref: '#/components/responses/NotFound' }

  /articles:
    get:
      tags: [Operational]
      summary: Reference front-end (dev only)
      operationId: articlesPage
      description: |
        The tab bar, per-surface forms and the Write-article modal with publish-time
        moderation. Worth reading before writing your own client — its
        `moderation-client.js` is the reference implementation of field joining and
        offset-based highlighting. Gated behind `DEMO_PAGE=1`.
      responses:
        "200": { description: HTML page, content: { text/html: {} } }
        "404": { $ref: '#/components/responses/NotFound' }

  /articles/{name}:
    get:
      tags: [Operational]
      summary: A file from the reference front-end (dev only)
      operationId: articlesAsset
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The asset. }
        "404": { $ref: '#/components/responses/NotFound' }

  /docs:
    get:
      tags: [Operational]
      summary: Swagger UI
      operationId: apiDocs
      description: |
        Serves Swagger UI **from this app's own origin**, so "Try it out" is a same-origin
        request and no CORS headers are needed.

        Served by default — this is the contract integrators code against, not a demo, so
        it is not gated behind `DEMO_PAGE`. `API_DOCS=0` turns it off where the endpoint
        list itself should stay unpublished; it then answers `404`.

        This service sends no CORS headers anywhere. Reaching a Swagger UI hosted
        elsewhere would mean relaxing that on every endpoint — including the
        unauthenticated submission endpoints — for a developer convenience.
      responses:
        "200": { description: The Swagger UI page., content: { text/html: {} } }
        "404": { $ref: '#/components/responses/NotFound' }

  /openapi.yaml:
    get:
      tags: [Operational]
      summary: This document
      operationId: openapiSpec
      description: |
        Served by default; `API_DOCS=0` turns it off.

        Served from the repository's `docs/` directory, which is where the spec lives so it
        sits beside `API_REFERENCE.md` and cannot drift from a second copy. A deployment
        that ships `flask_api/` alone carries no `docs/`, and this says so plainly rather
        than returning a bare 404.
      responses:
        "200":
          description: The OpenAPI document.
          content: { application/yaml: { schema: { type: string } } }
        "404":
          description: '`not_found` — docs disabled, or the spec is not present in this deployment.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---- Admin: auth ------------------------------------------------------------------
  /v1/admin/auth/me:
    get:
      tags: ["Admin: auth"]
      summary: Who is signed in
      operationId: adminMe
      description: |
        Who this request is authenticated as. With a BONC token it is the .NET answer, so
        this is the quickest end-to-end check that `BONC_AUTH_VERIFY_URL` is wired up.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin_id: { type: string, nullable: true, description: "The admin's BONC `UserRowId`; null for a script or open access." }
                  role: { type: string, nullable: true, description: "The admin role that let them in: `Admin` or `SuperAdmin`." }
                  session_id: { type: string, nullable: true, description: "Always null with `BONC_AUTH_STYLE=user-detail` - the .NET token carries none." }
                  via: { type: string, enum: [bonc, admin_token, open] }
              example: { admin_id: "01e94826-352a-4f6c-993b-43ec8fbd9453", role: SuperAdmin, session_id: null, via: bonc }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: '`not_admin` - a valid BONC sign-in, but not an admin.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }
        "503":
          description: '`auth_unavailable` - the .NET verification endpoint could not be reached.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }

  # ---- Admin: health ----------------------------------------------------------------
  /v1/admin/health:
    get:
      tags: ["Admin: health"]
      summary: What actually works right now
      operationId: adminHealth
      description: |
        `/ready` says what is **loaded**; this says what **works**. Each part is exercised
        once: one ordinary sentence through the text model, one blank picture through the
        vision encoder and through OCR, and a count from each database. A model can be loaded
        and still fail on every call, which is exactly what an admin cannot see while uploads
        quietly fail. Traffic comes from the audit log, so "no requests in the last hour" is
        as visible as "requests failing".

        Each check is `ok`, `off` (switched off in settings) or `down`. The overall `status`
        is `down` when the text model is down, `degraded` when anything else is, otherwise
        `ok`. Takes a second or two, because it really runs the models.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: One entry per check, plus traffic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  checked_at: { type: number, description: Epoch seconds. }
                  uptime_s: { type: integer }
                  mode: { type: string, enum: [sync, async] }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [ok, off, down] }
                        detail: { type: string }
                        ms: { type: number, description: How long the check took. }
                  traffic:
                    type: object
                    properties:
                      last_hour: { $ref: '#/components/schemas/TrafficWindow' }
                      last_day: { $ref: '#/components/schemas/TrafficWindow' }
                  service_auth: { type: string, enum: [open, enforced] }
                  moderation_disabled_for: { type: array, items: { type: string } }
              example:
                status: ok
                checked_at: 1764150000.0
                uptime_s: 3600
                mode: sync
                checks:
                  - { name: Text moderation model, status: ok, detail: "bonc-v9-ver3 (onnx) - scored a test sentence", ms: 41.2 }
                  - { name: Image moderation model, status: ok, detail: "CPUExecutionProvider - 16 rules, probe loaded", ms: 180.5 }
                  - { name: OCR (text in images), status: ok, detail: reads writing inside pictures, ms: 95.0 }
                  - { name: Audit log database, status: ok, detail: "12,345 moderation log rows", ms: 2.1 }
                  - { name: Image store database, status: ok, detail: 17 image categories, ms: 1.4 }
                traffic:
                  last_hour:
                    window_s: 3600
                    text: { requests: 42, rejected: 5, latency_ms_avg: 88.1, latency_ms_p95: 210.4 }
                    image: { requests: 7, rejected: 1, latency_ms_avg: 950.2, latency_ms_p95: 1800.0 }
                    last_decision_at: 1764149990.0
                  last_day: { window_s: 86400, text: { requests: 610, rejected: 48, latency_ms_avg: 91.0, latency_ms_p95: 230.0 }, image: { requests: 95, rejected: 12, latency_ms_avg: 990.0, latency_ms_p95: 1900.0 }, last_decision_at: 1764149990.0 }
                service_auth: open
                moderation_disabled_for: []
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ---- Admin: levels ----------------------------------------------------------------
  /v1/admin/moderation-levels:
    get:
      tags: ["Admin: levels"]
      summary: The whole levels table
      operationId: getModerationLevels
      description: Every named level, the default policy, and each configured surface.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LevelsTable' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/AdminDisabled' }

  /v1/admin/moderation-levels/{content_type}:
    parameters:
      - name: content_type
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ContentType' }
    put:
      tags: ["Admin: levels"]
      summary: Change one surface, live
      operationId: setModerationLevel
      description: |
        Takes effect on the **next request** — nothing restarts — and is persisted, so a
        restart keeps it.

        **To pick a level, use the Examples dropdown above the request body** — it lists all
        thirteen, each with the bar it sets. A request body is a JSON editor here, so the
        `level` field cannot be a dropdown of its own; that list is the picker. `LevelName`
        in the Schemas section has the same names with a table of what each one means.

        `enabled` and the bar are independent: setting a level on a disabled surface
        stores it for when the toggle comes back on.

        **An unknown surface is `404 no_such_surface`, not `400`** — the difference between
        "there is no such page" and "that value is wrong". An admin who typed `articles`
        (the plural) needs the first.
      security: [{ BoncAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                level:
                  $ref: '#/components/schemas/LevelName'
                reject_min: { type: number, minimum: 0, maximum: 1 }
                allow_max: { type: number, minimum: 0, maximum: 1 }
            # One per level, because a request body is a JSON editor in Swagger UI and an
            # enum on a body field is not offered as a dropdown there - this Examples list
            # is the only thing on the page you can actually pick a level from.
            examples:
              levelStrict:
                summary: "Level: strict - nothing contentious (bar 0.25)"
                value: { level: strict }
              levelMedium:
                summary: "Level: medium - the model's own calibration (bar 0.50)"
                value: { level: medium }
              levelLenient:
                summary: "Level: lenient - only clear abuse (bar 0.85)"
                value: { level: lenient }
              levelLevel1:
                summary: "Level: level_1 - bar 0.1"
                value: { level: level_1 }
              levelLevel2:
                summary: "Level: level_2 - bar 0.2"
                value: { level: level_2 }
              levelLevel3:
                summary: "Level: level_3 - bar 0.3"
                value: { level: level_3 }
              levelLevel4:
                summary: "Level: level_4 - bar 0.4"
                value: { level: level_4 }
              levelLevel5:
                summary: "Level: level_5 - bar 0.5"
                value: { level: level_5 }
              levelLevel6:
                summary: "Level: level_6 - bar 0.6"
                value: { level: level_6 }
              levelLevel7:
                summary: "Level: level_7 - bar 0.7"
                value: { level: level_7 }
              levelLevel8:
                summary: "Level: level_8 - bar 0.8"
                value: { level: level_8 }
              levelLevel9:
                summary: "Level: level_9 - bar 0.9"
                value: { level: level_9 }
              levelLevel10:
                summary: "Level: level_10 - bar 1.0"
                value: { level: level_10 }
              toggleOff: { summary: Stop moderating this surface, value: { enabled: false } }
              toggleOn: { summary: Start moderating it again, value: { enabled: true } }
              rawBar: { summary: Set the rating directly, value: { reject_min: 0.62 } }
      responses:
        "200":
          description: The resulting policy for that surface.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeaturePolicy' }
        "400":
          description: '`invalid_request` — unknown fields, or an invalid value.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: '`no_such_surface` — lists the surfaces that do exist.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: ["Admin: levels"]
      summary: Drop a surface's override so it follows the default again
      operationId: clearModerationLevel
      description: |
        **Not the same as setting it back to the default's current value**, which freezes a
        copy that stops tracking later changes to the default. An admin undoing an
        experiment means "follow the default", and this is the only way to express it.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: Cleared. `had_override` says whether anything was actually removed.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/FeaturePolicy' }
                  - type: object
                    properties:
                      cleared: { type: boolean }
                      had_override: { type: boolean }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: '`no_such_surface`'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /v1/admin/moderation-settings:
    get:
      tags: ["Admin: levels"]
      summary: Flattened view for the dashboard
      operationId: getModerationSettings
      description: |
        `level` is non-null **only when every surface agrees**. `mixed` is true when they
        do not — a UI should warn before overwriting in that case.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: The flattened view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: ["Admin: levels"]
      summary: Apply one setting to EVERY surface
      operationId: putModerationSettings
      description: |
        > **This overwrites every surface.** Any per-surface tuning done through
        > `PUT /v1/admin/moderation-levels/{content_type}` is silently flattened by a save
        > here. Check `mixed` on the `GET` before calling this.

        Writes are serialised behind a lock so two admins saving at once cannot interleave.
        If the database write fails the in-memory levels are rolled back, so memory and
        disk keep telling the same story, and the call returns `500 save_failed` having
        changed nothing.
      security: [{ BoncAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, level]
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                level:
                  $ref: '#/components/schemas/LevelName'
            # Same reason as the per-surface PUT: pick one of these rather than typing the
            # body. This endpoint writes EVERY surface at once - see the description.
            examples:
              allStrict: { summary: "Every surface on, strict", value: { enabled: true, level: strict } }
              allMedium: { summary: "Every surface on, medium", value: { enabled: true, level: medium } }
              allLenient: { summary: "Every surface on, lenient", value: { enabled: true, level: lenient } }
              allOff:
                summary: Stop moderating EVERYTHING (read the description first)
                value: { enabled: false, level: strict }
      responses:
        "200":
          description: The resulting flattened view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsView' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500":
          description: '`save_failed` — nothing was changed.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }

  /v1/admin/model/reload:
    post:
      tags: ["Admin: levels"]
      summary: Hot-swap the model bundle (token only)
      operationId: reloadModel
      description: |
        **Accepts `X-Admin-Token` only** — a BONC admin token is not enough here, unlike
        every other admin endpoint. Returns `404` when `ADMIN_TOKEN` is unset.

        Swaps to the bundle in `MODEL_DIR`. **Only swaps if the new model loads and warms
        up**; otherwise the old one stays live and the error names what is still serving.
      parameters:
        - name: X-Admin-Token
          in: header
          required: true
          description: The server's `ADMIN_TOKEN` (a field here, not a sign-in option under Authorize).
          schema: { type: string }
      responses:
        "200":
          description: Swapped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: reloaded }
                  previous_version: { type: string, nullable: true }
                  model_version: { type: string, nullable: true }
        "401":
          description: '`unauthorized` — invalid admin token.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "404":
          description: '`not_found` — `ADMIN_TOKEN` is unset, so this is disabled.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        "500":
          description: '`reload_failed` — carries `active_version`, which is still serving.'
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  # ---- Admin: audit -----------------------------------------------------------------
  /v1/admin/moderation-logs:
    get:
      tags: ["Admin: audit"]
      summary: List decisions
      operationId: getModerationLogs
      description: Malformed `limit` or `offset` fall back to the defaults rather than erroring.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: decision, in: query, schema: { type: string, enum: [allow, revise, reject] } }
        - { name: content_type, in: query, schema: { $ref: '#/components/schemas/ContentType' } }
        - { name: severity, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: q, in: query, description: Free-text search, schema: { type: string } }
        - { name: modality, in: query, description: 'Only text or only image decisions.', schema: { type: string, enum: [text, image] } }
        - { name: since, in: query, description: 'Epoch seconds or ISO 8601.', schema: { type: string } }
        - { name: until, in: query, description: 'Epoch seconds or ISO 8601.', schema: { type: string } }
        - { name: user, in: query, description: "One member's rows only.", schema: { type: string } }
        - { name: offender_min, in: query, schema: { type: integer, default: 3 } }
        - { name: offender_rate, in: query, schema: { type: number, default: 0.5 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: A page of decisions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { type: object } }
                  total: { type: integer, description: "Rows matching the filters, not rows returned." }
                  limit: { type: integer }
                  offset: { type: integer }
                  stats:
                    type: object
                    description: Counts over the whole filtered set, for the header tiles.
                    properties:
                      allow: { type: integer }
                      revise: { type: integer }
                      reject: { type: integer }
                      total: { type: integer }
                  by_modality:
                    type: object
                    description: 'The same counts per model. The screen shows these two cards, never a combined total. They follow every filter except `decision`.'
                    properties:
                      text: { $ref: '#/components/schemas/ModalityCounts' }
                      image: { $ref: '#/components/schemas/ModalityCounts' }
                  repeat_offenders:
                    type: object
                    description: 'As `GET /v1/admin/moderation-logs/repeat-offenders`, each user with `blocked`.'
                  blocked_members:
                    type: array
                    items: { type: string }
                    description: Every member id currently blocked, for badging rows in the table.
              example:
                logs: []
                total: 0
                limit: 50
                offset: 0
                stats: { allow: 40, revise: 2, reject: 9, total: 51, reject_rate: 0.1765 }
                by_modality:
                  text: { total: 38, allow: 30, revise: 2, reject: 6, reject_rate: 0.1579 }
                  image: { total: 13, allow: 10, revise: 0, reject: 3, reject_rate: 0.2308 }
                repeat_offenders:
                  users:
                    - { user_id: member-2045, total: 9, rejected: 6, revised: 0, text_rejected: 4, image_rejected: 2, reject_rate: 0.6667, last_reject_at: 1794987600, last_at: 1794987900, blocked: true }
                  min_rejects: 3
                  min_rate: 0.5
                  attributed_rows: 34
                blocked_members: [member-2045]
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: ["Admin: audit"]
      summary: Clear the entire audit log
      operationId: clearModerationLogs
      description: |
        > **No confirmation step and no filter — this takes everything.**
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleared: { type: boolean }
                  count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/moderation-logs/export:
    get:
      tags: ["Admin: audit"]
      summary: Download the log as text, Word or Excel
      operationId: exportModerationLogs
      description: |
        Takes the **same filters** as the list endpoint, because the button sits on a
        filtered screen and "export" there can only mean "what I am looking at".

        **Not paginated** — it walks the whole matching set up to `max_rows` (capped at
        50,000) and the file records both numbers about itself.

        Only the Excel path has an optional dependency. Without `openpyxl` it returns
        `503` naming the missing package; text and Word still work.
      security: [{ BoncAdmin: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [txt, doc, xlsx, word, docx, excel, xls], default: txt }
          description: '`word`/`docx` map to `doc`; `excel`/`xls` map to `xlsx`.'
        - { name: decision, in: query, schema: { type: string } }
        - { name: content_type, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: modality, in: query, schema: { type: string, enum: [text, image] } }
        - { name: since, in: query, description: 'Epoch seconds or ISO 8601.', schema: { type: string } }
        - { name: until, in: query, description: 'Epoch seconds or ISO 8601.', schema: { type: string } }
        - { name: user, in: query, description: "One member's rows only.", schema: { type: string } }
        - { name: max_rows, in: query, schema: { type: integer, default: 50000, maximum: 50000 } }
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="…"' }
            X-Export-Rows: { schema: { type: integer }, description: Rows actually written. }
            X-Export-Total: { schema: { type: integer }, description: Rows that matched the filter. }
            Cache-Control: { schema: { type: string }, description: '`no-store` — a point-in-time copy.' }
          content:
            text/plain: {}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
        "400":
          description: '`bad_format`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "503":
          description: '`export_unavailable` — `openpyxl` is missing. Text and Word still work.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }

  /v1/admin/moderation-logs/repeat-offenders:
    get:
      tags: ["Admin: audit"]
      summary: Members refused too often
      operationId: listRepeatOffenders
      description: |
        Members whose submissions are refused too often in a window. The same list the
        admin log screen highlights.

        A member qualifies only when **both** parts of the rule hold: at least
        `min_rejects` refusals **and** a refusal rate of at least `min_rate`. A count alone
        would flag the busiest honest member; a rate alone would flag a newcomer with one
        post refused out of one.

        Counted per `user_id`, which comes from the moderation calls (`user_id` / `userId`
        in the body, or an `X-User-Id` header). Submissions without one are not counted;
        `attributed_rows` says how many could be.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: min_rejects, in: query, description: 'Minimum refusals. Alias `offender_min`.', schema: { type: integer, default: 3, minimum: 1 } }
        - { name: min_rate, in: query, description: 'Minimum share refused, 0-1. Alias `offender_rate`.', schema: { type: number, default: 0.5, minimum: 0, maximum: 1 } }
        - { name: since, in: query, description: 'Epoch seconds or ISO 8601. Naive times are UTC.', schema: { type: string } }
        - { name: until, in: query, description: 'Epoch seconds or ISO 8601.', schema: { type: string } }
        - { name: hours, in: query, description: 'Shorthand for `since` = now minus this many hours. Ignored when `since` is given.', schema: { type: number } }
        - { name: content_type, in: query, schema: { $ref: '#/components/schemas/ContentType' } }
        - { name: modality, in: query, description: 'Count only text or only image decisions.', schema: { type: string, enum: [text, image] } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: The members who meet the rule, most refusals first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string }
                        total: { type: integer, description: Submissions in the window. }
                        rejected: { type: integer }
                        revised: { type: integer }
                        text_rejected: { type: integer }
                        image_rejected: { type: integer }
                        reject_rate: { type: number, description: rejected / total. }
                        last_reject_at: { type: number, description: Epoch seconds. }
                        last_at: { type: number, description: Epoch seconds. }
                        blocked: { type: boolean, description: Already blocked as a member. }
                  min_rejects: { type: integer }
                  min_rate: { type: number }
                  attributed_rows: { type: integer, description: Submissions in the window that carried a member id. }
                  window:
                    type: object
                    properties:
                      since: { type: number, nullable: true }
                      until: { type: number, nullable: true }
              example:
                users:
                  - { user_id: member-2045, total: 9, rejected: 6, revised: 0, text_rejected: 4, image_rejected: 2, reject_rate: 0.6667, last_reject_at: 1794987600, last_at: 1794987900, blocked: true }
                  - { user_id: member-7781, total: 5, rejected: 4, revised: 0, text_rejected: 3, image_rejected: 1, reject_rate: 0.8, last_reject_at: 1794987600, last_at: 1794987600, blocked: false }
                min_rejects: 3
                min_rate: 0.5
                attributed_rows: 42
                window: { since: 1794901200, until: null }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/moderation-logs/repeat-offenders/{user_id}:
    get:
      tags: ["Admin: audit"]
      summary: Is this member a repeat offender?
      operationId: getMemberModerationRecord
      description: |
        One member's record in the window and a yes/no answer, with the numbers behind it
        either way. Takes the same rule and window parameters as the list. A member with no
        submissions in the window comes back with `total: 0` and `is_repeat_offender: false`,
        not 404. `blocked` says whether they are blocked already; block them with
        `POST /v1/admin/blocked-clients` and `scope: member`.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: user_id, in: path, required: true, description: 'The member id your platform sends as `user_id`.', schema: { type: string, maxLength: 128, example: member-7781 } }
        - { name: min_rejects, in: query, schema: { type: integer, default: 3, minimum: 1 } }
        - { name: min_rate, in: query, schema: { type: number, default: 0.5, minimum: 0, maximum: 1 } }
        - { name: since, in: query, schema: { type: string } }
        - { name: until, in: query, schema: { type: string } }
        - { name: hours, in: query, schema: { type: number } }
      responses:
        "200":
          description: The member's record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  is_repeat_offender: { type: boolean }
                  blocked: { type: boolean, description: Already blocked as a member. }
                  total: { type: integer }
                  allowed: { type: integer }
                  revised: { type: integer }
                  rejected: { type: integer }
                  text_rejected: { type: integer }
                  image_rejected: { type: integer }
                  reject_rate: { type: number, nullable: true, description: Null when the member has no submissions in the window. }
                  last_reject_at: { type: number, nullable: true }
                  last_at: { type: number, nullable: true }
                  min_rejects: { type: integer }
                  min_rate: { type: number }
                  window:
                    type: object
                    properties:
                      since: { type: number, nullable: true }
                      until: { type: number, nullable: true }
              example: { user_id: member-7781, is_repeat_offender: true, blocked: false, total: 5, allowed: 1, revised: 0, rejected: 4, text_rejected: 3, image_rejected: 1, reject_rate: 0.8, last_reject_at: 1794987600, last_at: 1794987600, min_rejects: 3, min_rate: 0.5, window: { since: null, until: null } }
        "400":
          description: '`bad_user` - empty or `anonymous`.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/admin/moderation-logs/{request_id}:
    get:
      tags: ["Admin: audit"]
      summary: One decision in full
      operationId: getModerationLogDetail
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The stored decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/admin/moderation-logs/{request_id}/override:
    post:
      tags: ["Admin: audit"]
      summary: Overturn a decision (approve a refusal, or refuse an approval)
      operationId: overrideDecision
      description: |
        An admin's verdict replaces the model's **in this service's record**: the log, its
        filters and counts, and the repeat-offender rule all follow it, so a refusal approved
        on review no longer counts against the member. The model's verdict is kept as
        `model_decision`.

        **This does not publish anything.** The .NET side owns the content: after a `200`,
        it publishes (`Action: "approved"`) or keeps the content refused (`Action: "reject"`).

        A second override replaces the first; the model's verdict is never lost. Overriding
        back to the model's own verdict is an undo. `request_id` is in every moderation
        response; without it, use `POST /v1/admin/moderation-logs/override`.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideRequest' }
            examples:
              approve: { summary: Approve a refusal, value: { decision: approved, reason: "Quoting a news headline, not abuse." } }
              refuse: { summary: Refuse an approval, value: { decision: reject, reason: "Scam the model missed." } }
      responses:
        "200":
          description: The verdict that now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideResult' }
        "400": { description: "`bad_decision` - decision is not `approved` or `reject`.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: ["Admin: audit"]
      summary: Undo an override
      operationId: clearDecisionOverride
      description: The model's verdict stands again. Undoing a decision that was never overridden is not an error.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The verdict that now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  /v1/admin/moderation-logs/override:
    post:
      tags: ["Admin: audit"]
      summary: Overturn a decision, found by the platform's content id
      operationId: overrideDecisionByContent
      description: |
        The same as `POST /v1/admin/moderation-logs/{request_id}/override`, for when the
        platform kept its own ids rather than the `request_id`. Applies to the **newest**
        decision recorded for that `content_type` + `content_id`.
      security: [{ BoncAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OverrideRequest'
                - type: object
                  required: [content_type, content_id]
                  properties:
                    content_type: { $ref: '#/components/schemas/ContentType' }
                    content_id: { type: string, example: "123" }
            example: { content_type: article, content_id: "123", decision: approved, reason: "Fine on review." }
      responses:
        "200":
          description: The verdict that now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideResult' }
        "400": { description: "`missing_content` (no content_type / content_id) or `bad_decision`.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ---- Admin: blocking --------------------------------------------------------------
  /v1/admin/blocked-clients:
    get:
      tags: ["Admin: blocking"]
      summary: List blocked members, addresses and networks
      operationId: listBlockedClients
      description: Every block, newest first. `scope` says what each one refuses.
      security: [{ BoncAdmin: [] }]
      responses:
        "200":
          description: Current blocks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { type: array, items: { $ref: '#/components/schemas/BlockedClient' } }
              example:
                blocked:
                  - { id: 7, value: member-2045, scope: member, reason: repeat scam listings, created_by: admin@example.com, created_at: 1794988000.5 }
                  - { id: 3, value: 203.0.113.45, scope: ip, reason: spam burst, created_by: admin@example.com, created_at: 1794900000.1 }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: ["Admin: blocking"]
      summary: Block a member, an address or a network
      operationId: addBlockedClient
      description: |
        Pick one of the examples below to fill the body.

        **`scope: member`** blocks one portal member by `user_id`, wherever they post from:
        every `/v1/moderate*` call that names them (in the body or `X-User-Id`) is refused
        with `403 member_blocked` until unblocked. It works only when the portal sends the
        member's id on each moderation call. An id that reads like an address blocks only the
        member, never the address. `anonymous` cannot be blocked this way.

        **`scope: ip` / `network`** refuse a connection with `403 client_blocked`. Blocking
        an address stops casual repetition from one connection. It is **not an identity
        control**: a mobile connection changes address by switching to cellular, and a VPN
        changes it by clicking.

        > A `/24` can be one household or one office behind a single NAT, so refusing a
        > network can refuse people who did nothing. Prefer `ip` scope unless you have a
        > reason.

        Refusing your own connection returns `409 would_block_self` — the screen that
        would undo a self-block sits behind the block.
      security: [{ BoncAdmin: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, description: 'A member id, an IP address, or a network such as `203.0.113.0/24`.' }
                scope: { type: string, enum: [ip, network, member], default: ip }
                reason: { type: string, description: Shown to other admins in the list. }
            examples:
              member:
                summary: Block a member
                value: { value: member-2045, scope: member, reason: repeat scam listings }
              ip:
                summary: Block one device's address
                value: { value: 203.0.113.45, scope: ip, reason: spam burst }
              network:
                summary: Block a whole /24 network
                value: { value: 203.0.113.0/24, scope: network, reason: rotating addresses }
      responses:
        "201":
          description: Blocked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked: { $ref: '#/components/schemas/BlockedClient' }
                  message: { type: string }
              example:
                blocked: { id: 7, value: member-2045, scope: member, reason: repeat scam listings, created_by: admin@example.com, created_at: 1794988000.5 }
                message: Blocked member member-2045.
        "400":
          description: '`missing_value`, `bad_scope`, `bad_address` or `bad_member` (`anonymous` or over 128 characters)'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "409":
          description: '`would_block_self` — names the address it detected.'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }

  /v1/admin/blocked-clients/{value}:
    delete:
      tags: ["Admin: blocking"]
      summary: Unblock a member, an address or a network
      operationId: removeBlockedClient
      description: |
        Send the same `value` and `scope` the block was made with. **`scope` defaults to
        `ip`**, so unblocking a member needs `scope=member`, for example
        `DELETE /v1/admin/blocked-clients/member-2045?scope=member`.
      security: [{ BoncAdmin: [] }]
      parameters:
        - { name: value, in: path, required: true, description: 'The member id, address or network that was blocked.', schema: { type: string, example: member-2045 } }
        - { name: scope, in: query, schema: { type: string, enum: [ip, network, member], default: ip } }
      responses:
        "200":
          description: Unblocked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unblocked: { type: boolean }
                  count: { type: integer }
                  message: { type: string }
              example: { unblocked: true, count: 1, message: Unblocked member-2045. }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: '`not_blocked`'
          content: { application/json: { schema: { $ref: '#/components/schemas/AdminError' } } }

  # ---- Admin: images ----------------------------------------------------------------
